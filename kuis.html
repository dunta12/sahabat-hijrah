/* =====================================================
   AUDIO ENGINE
===================================================== */

let audioCtx=null;
let muted=localStorage.getItem("kuis_mute")==="1";
let musicTimer=null;
let musicNodes=[];

function audio(){

 if(!audioCtx){
  try{
   audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  }catch(e){}
 }

 if(audioCtx && audioCtx.state==="suspended"){
  audioCtx.resume();
 }

 return audioCtx;
}

function tone(freq,duration,type="sine",volume=.12,delay=0,endFreq=null){

 if(muted)return;

 const a=audio();
 if(!a)return;

 const now=a.currentTime+delay;

 const osc=a.createOscillator();
 const gain=a.createGain();

 osc.type=type;

 osc.frequency.setValueAtTime(freq,now);

 if(endFreq){
  osc.frequency.exponentialRampToValueAtTime(
   endFreq,
   now+duration
  );
 }

 gain.gain.setValueAtTime(0,now);

 gain.gain.linearRampToValueAtTime(
  volume,
  now+.025
 );

 gain.gain.exponentialRampToValueAtTime(
  .0001,
  now+duration
 );

 osc.connect(gain);
 gain.connect(a.destination);

 osc.start(now);
 osc.stop(now+duration+.05);
}

/* MUSIC */

function startMusic(){

 if(muted || musicTimer)return;

 const a=audio();
 if(!a)return;

 /*
   Bass lembut
 */
 const bass=a.createOscillator();
 const bassGain=a.createGain();

 bass.type="sine";
 bass.frequency.value=82;
 bassGain.gain.value=.035;

 bass.connect(bassGain);
 bassGain.connect(a.destination);

 bass.start();

 musicNodes=[bass,bassGain];

 const melody=[
  262,294,330,392,
  330,294,262,220,
  262,330,392,440
 ];

 let pos=0;

 musicTimer=setInterval(()=>{

  if(muted)return;

  const f=melody[pos%melody.length];

  tone(f,1.1,"sine",.045);
  tone(f*2,0.7,"sine",.025,.05);

  pos++;

 },1100);
}

function stopMusic(){

 if(musicTimer){
  clearInterval(musicTimer);
  musicTimer=null;
 }

 musicNodes.forEach(n=>{
  try{
   if(n.stop)n.stop();
  }catch(e){}
 });

 musicNodes=[];
}

function toggleSound(){

 muted=!muted;

 localStorage.setItem(
  "kuis_mute",
  muted?"1":"0"
 );

 updateSoundButton();

 if(muted){
  stopMusic();
 }else if(gameMode==="quiz"){
  startMusic();
 }
}

   CATEGORY
===================================================== */

function selectCategory(c){

 sound.click();

 category=c;

 renderHome();

}


/* =====================================================
   START GAME
===================================================== */

function startGame(){

 sound.click();

 const pool=QUESTIONS.filter(q=>{

  if(category==="mixed")return true;

  if(category==="husna")return q.k==="h";

  return q.k==="p";

 });

 round=[];

 [1,2,3].forEach(d=>{

  const part=shuffle(
   pool.filter(q=>q.d===d)
  ).slice(0,4);

  round=round.concat(part);

 });

 /*
  Jika kategori tertentu memiliki kurang dari 12,
  isi dari pool secara acak.
 */
 while(round.length<12){

  round.push(
   pool[Math.floor(Math.random()*pool.length)]
  );

 }

 current=0;

 help={
  fifty:false,
  audience:false,
  hint:false
 };

 gameMode="quiz";

 startMusic();

 renderQuiz();

 startTimer();

}


/* =====================================================
   TIMER
===================================================== */

function startTimer(){

 clearInterval(timer);

 timeLeft=30;

 updateTimer();

 timer=setInterval(()=>{

  if(answering)return;

  timeLeft--;

  updateTimer();

  if(timeLeft<=5 && timeLeft>0){

   tone(750,.08,"square",.08);

  }

  if(timeLeft<=0){

   clearInterval(timer);

   timeoutAnswer();

  }

 },1000);

}

function updateTimer(){

 const number=document.getElementById("timeNumber");
 const bar=document.getElementById("timeBar");
 const box=document.getElementById("timerBox");

 if(!number || !bar)return;

 number.textContent=
  timeLeft+" "+TText("seconds");

 bar.style.width=
  (timeLeft/30*100)+"%";

 if(timeLeft<=8){
  box.classList.add("timerDanger");
 }else{
  box.classList.remove("timerDanger");
 }

}

/* =====================================================
   ANSWER
===================================================== */

function answer(index){

 if(answering)return;

 answering=true;

 clearInterval(timer);

 sound.select();

 const q=round[current][lang];

 document.getElementById(
  "option"+index
 ).classList.add("selected");

 sound.lock();

 setTimeout(()=>{

  if(index===q.c){

   document.getElementById(
    "option"+index
   ).classList.remove("selected");

   document.getElementById(
    "option"+index
   ).classList.add("correct");

   showMessage(
    TText("correct"),
    "good"
   );

   sound.correct();

   if(SAFE.includes(current)){
    sound.level();
   }

   setTimeout(()=>{

    if(current===11){

     finish("win");

    }else{

     current++;

     answering=false;

     renderQuiz();

     startTimer();

    }

   },1200);

  }else{

   document.getElementById(
    "option"+index
   ).classList.remove("selected");

   document.getElementById(
    "option"+index
   ).classList.add("wrong");

   document.getElementById(
    "option"+q.c
   ).classList.add("correct");

   showMessage(
    TText("wrong")+
    "<br><small>"+
    TText("answer")+": "+
    q.a[q.c]+
    "</small>",
    "bad"
   );

   sound.wrong();

   setTimeout(()=>{
    finish("wrong");
   },1800);

  }

 },700);

}


/* =====================================================
   TIMEOUT
===================================================== */

function timeoutAnswer(){

 if(answering)return;

 answering=true;

 sound.time();

 const q=round[current][lang];

 document.querySelectorAll(".option")
 .forEach(b=>b.disabled=true);

 document.getElementById(
  "option"+q.c
 ).classList.add("correct");

 showMessage(
  TText("timeout")+
  "<br><small>"+
  TText("answer")+": "+
  q.a[q.c]+
  "</small>",
  "time"
 );

 setTimeout(()=>{
  finish("timeout");
 },1800);

}

function useFifty(){

 if(help.fifty||answering)return;

 help.fifty=true;

 sound.help();

 const q=round[current][lang];

 const wrong=[
  0,1,2,3
 ].filter(i=>i!==q.c);

 shuffle(wrong)
 .slice(0,2)
 .forEach(i=>{

  const btn=document.getElementById(
   "option"+i
  );

  btn.classList.add("disabled");
  btn.disabled=true;

 });

 document.getElementById("help50").disabled=true;

}


/* =====================================================
   AUDIENCE
===================================================== */

function useAudience(){

 if(help.audience||answering)return;

 help.audience=true;

 sound.help();

 const q=round[current][lang];

 let correct=45+
  Math.floor(Math.random()*31);

 let remain=100-correct;

 let values=[
  Math.floor(remain*.45),
  Math.floor(remain*.30),
  0
 ];

 values[2]=remain-values[0]-values[1];

 const wrong=[
  0,1,2,3
 ].filter(i=>i!==q.c);

 let pct=[0,0,0,0];

 pct[q.c]=correct;

 wrong.forEach((idx,j)=>{
  pct[idx]=values[j];
 });

 showMessage(
  "👥 "+
  pct.map((p,i)=>
   `${"ABCD"[i]} ${p}%`
  ).join(" · "),
  "good"
 );

 document.getElementById(
  "helpAudience"
 ).disabled=true;

}

/* =====================================================
   FINISH
===================================================== */

function finish(type){

 clearInterval(timer);

 stopMusic();

 let amount=0;

 if(type==="win"){

  amount=1000000;

 }else if(type==="walk"){

  amount=current>0?
   PRIZES[current-1]:
   0;

 }else{

  /*
   Milestone:
   9+ benar → 500.000
   5-8 benar → 10.000
   lainnya → 0
  */

  if(current>=9)amount=500000;
  else if(current>=5)amount=10000;
  else amount=0;

 }

 if(type==="win"){
  sound.win();
 }

 const best=parseInt(
  localStorage.getItem("kuis_best")||"0"
 );

 if(amount>best){

  localStorage.setItem(
   "kuis_best",
   amount
  );

 }

 lastResult={
  type:type,
  amount:amount,
  question:current+1
 };

 gameMode="result";

 renderResult();

}


/* =====================================================
   RESULT
===================================================== */

function renderResult(){

 showOnly("result");

 const r=lastResult;

 let icon="💙";
 let title=TText("keep");

 if(r.type==="win"){

  icon="🏆";
  title=TText("amazing");

 }else if(r.type==="walk"){

  icon="🤝";
  title=TText("walked");

 }else if(r.type==="timeout"){

  icon="⏰";
  title=TText("timeout");

 }

 let badge="💪";

 if(r.amount>=1000000)
  badge="🏆 Sahabat Hijrah Sejati";

 else if(r.amount>=500000)
  badge="🥇 Sahabat Berilmu";

 else if(r.amount>=10000)
  badge="🥈 Sahabat Pemula";

 else
  badge="🌱 Terus Belajar";

 document.getElementById("result").innerHTML=`

 <div class="card center">

  <div class="resultIcon">
   ${icon}
  </div>

  <h2>${title}</h2>

  <div class="resultMoney">
   💰 ${fmt(r.amount)}
  </div>

  <div class="muted">
   ${TText("take")}
  </div>

  <div class="badge">
   ${badge}
  </div>

  <div class="tip">
   📖 ${TText("secondChance")}
  </div>

  <button class="btn" onclick="startGame()">
   ${TText("again")}
  </button>

  <button class="btn gold" onclick="goHome()">
   ${TText("home")}
  </button>

 </div>

 `;

}


/* =====================================================
   HOME
===================================================== */

function goHome(){

 sound.click();

 clearInterval(timer);

 stopMusic();

 gameMode="home";

 render();

}


/* =====================================================
   LEARN MODE
===================================================== */

function openLearn(){

 sound.click();

 gameMode="learn";

 renderLearn();

}

function renderLearn(){

 showOnly("learn");

 let content="";

 if(learningTab==="names"){

  content=NAMES.map((n,i)=>`

   <div class="learnItem">

    <div class="learnNum">
     ${i+1}
    </div>

    <div class="ar">
     ${n[0]}
    </div>

    <div class="learnMeaning">

     <b>${n[1]}</b>

     <br>

     <span class="muted">
      ${lang==="id"?n[2]:n[3]}
     </span>

    </div>

   </div>

  `).join("");

 }else{

  content=`
   <div style="line-height:1.65">
    ${GUIDE[lang]}
   </div>
  `;

 }

 document.getElementById("learn").innerHTML=`

 <div class="card">

  <button class="chip" onclick="goHome()">
   ${TText("back")}
  </button>

  <button
   class="chip ${learningTab==="names"?"on":""}"
   onclick="learningTab='names';renderLearn()">

   ${TText("names")}

  </button>

  <button
   class="chip ${learningTab==="guide"?"on":""}"
   onclick="learningTab='guide';renderLearn()">

   ${TText("guide")}

  </button>

 </div>

 <div class="card">

  ${content}

 </div>

 `;

}


/* =====================================================
   INITIALIZE
===================================================== */

document.getElementById("headerTitle").textContent=
 TText("title");

updateSoundButton();

renderHome();

</script>

</body>
</html>
