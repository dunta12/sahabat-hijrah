['النافع','An-Nafi\'','Maha Pemberi Manfaat','The Benefactor'],
['النور','An-Nur','Maha Bercahaya','The Light'],
['الهادي','Al-Hadi','Maha Pemberi Petunjuk','The Guide'],
['البديع','Al-Badi\'','Maha Pencipta Unik','The Incomparable'],
['الباقي','Al-Baqi','Maha Kekal','The Everlasting'],
['الوارث','Al-Warits','Maha Mewarisi','The Inheritor'],
['الرشيد','Ar-Rasyid','Maha Pandu','The Guide to the Right Path'],
['الصبور','Ash-Shabur','Maha Sabar','The Most Patient']
];
const PANDUAN={
id:'<b>🫧 Rukun Wudhu (6):</b> niat · membasuh muka · membasuh tangan sampai siku · mengusap sebagian kepala · membasuh kaki sampai mata kaki · tertib.<br><br><b>🕌 Urutan Sholat:</b> takbiratul ihram → Al-Fatihah → (surat) → ruku\' → i\'tidal → sujud → duduk di antara dua sujud → sujud → rakaat berikutnya → tasyahud → salam.<br><br><b>🤲 Niat (latin):</b><br>Subuh: Ushalli fardhas-shubhi rak\'ataini mustaqbilal qiblati ada\'an lillahi ta\'ala.<br>Dzuhur: ...fardhazh-zhuhri arba\'a raka\'atin...<br>Ashar: ...fardhal-\'ashri arba\'a raka\'atin...<br>Maghrib: ...fardhal-maghribi tsalatsa raka\'atin...<br>Isya: ...fardhal-\'isya\'i arba\'a raka\'atin...<br><br><b>Doa singkat:</b> Rabbana atina fid-dunya hasanah wa fil-akhirati hasanah wa qina \'adzaban-nar.',
en:'<b>🫧 Wudu (6 obligatory acts):</b> intention · washing the face · washing arms to elbows · wiping part of the head · washing feet to ankles · order.<br><br><b>🕌 Prayer order:</b> takbiratul ihram → Al-Fatihah → (surah) → ruku\' → i\'tidal → sujud → sitting between sujud → sujud → next rakaat → tashahhud → salam.<br><br><b>🤲 Intention (latin):</b><br>Fajr: Ushalli fardhas-subhi rak\'ataini mustaqbilal qiblati ada\'an lillahi ta\'ala.<br>Dhuhr: ...fardhaz-zuhri arba\'a raka\'atin...<br>Asr: ...fardhal-\'asri arba\'a raka\'atin...<br>Maghrib: ...fardhal-maghribi thalatha raka\'atin...<br>Isha: ...fardhal-\'isha\'i arba\'a raka\'atin...<br><br><b>Short du\'a:</b> Rabbana atina fid-dunya hasanah wa fil-akhirati hasanah wa qina \'adhaban-nar.'
};
let lang=localStorage.getItem('kuis_lang')||'id',L=LBL[lang],mode='home',cat='campur',round=[],idx=0,locked=false,used={},learnTab='n',lastEnd='';
function $(id){return document.getElementById(id);}
function fmt(n){return n.toLocaleString(lang==='id'?'id-ID':'en-US');}
function gantiLang(){lang=lang==='id'?'en':'id';localStorage.setItem('kuis_lang',lang);L=LBL[lang];$('hJudul').textContent=L.judul;renderNow();}
function renderNow(){if(mode==='home')renderHome();else if(mode==='quiz')renderQ();else if(mode==='end')renderEnd(lastEnd);else renderLearn();}
function acak(a){return a.slice().sort(function(){return Math.random()-.5});}
function show(id){['scrHome','scrQuiz','scrEnd','scrLearn'].forEach(function(x){$(x).style.display=x===id?'block':'none';});}
function renderHome(){mode='home';musikOff();show('scrHome');
$('scrHome').innerHTML='<div class="card"><h3>🎮 '+L.judul+'</h3><div class="muted">'+L.sub+'</div><div style="margin-top:10px">'+L.kat+'</div><div><button class="chip'+(cat==='husna'?' on':'')+'" onclick="cat=\'husna\';renderHome()">'+L.husna+'</button><button class="chip'+(cat==='panduan'?' on':'')+'" onclick="cat=\'panduan\';renderHome()">'+L.panduan+'</button><button class="chip'+(cat==='campur'?' on':'')+'" onclick="cat=\'campur\';renderHome()">'+L.campur+'</button></div><button class="btn" onclick="mulai()">'+L.mulai+'</button><button class="btn gold" onclick="renderLearn()">'+L.belajar+'</button><div class="muted">'+L.best+': <b>'+fmt(parseInt(localStorage.getItem('kuis_best')||0))+'</b></div></div>';}
function mulai(){sfx.klik();const pool=SOAL.filter(function(s){return cat==='campur'||s.k===(cat==='husna'?'h':'p');});round=[];[1,2,3].forEach(function(d){round=round.concat(acak(pool.filter(function(s){return s.d===d;})).slice(0,4));});idx=0;locked=false;used={ff:false,pm:false,hn:false};mode='quiz';musikOn();renderQ();}
function renderQ(){mode='quiz';show('scrQuiz');const s=round[idx],q=s[lang];
let lad='';for(let i=11;i>=0;i--){lad+='<div class="'+(i===idx?'cur':'')+' '+(AMANIDX.indexOf(i)>-1?'safe':'')+'"><span>'+(AMANIDX.indexOf(i)>-1?'🛡 ':'')+(i+1)+'</span><span>'+fmt(HADIAH[i])+'</span></div>';}
$('scrQuiz').innerHTML='<div class="card" style="padding:8px"><div class="ladder">'+lad+'</div></div><div class="card"><div class="muted">'+L.soal+' '+(idx+1)+'/12 · 💰 '+fmt(idx>0?HADIAH[idx-1]:0)+'</div><h3 style="margin-top:8px">'+q.q+'</h3><div id="opts">'+q.a.map(function(o,i){return '<button class="opt" id="op'+i+'" onclick="pilih('+i+')"><b>'+'ABCD'[i]+'</b>'+o+'</button>';}).join('')+'</div><div id="extra"></div><div><button class="lif" id="lf1" onclick="pakaiFF()" '+(used.ff?'disabled':'')+'>'+L.ff+'</button><button class="lif" id="lf2" onclick="pakaiPM()" '+(used.pm?'disabled':'')+'>'+L.pemirsa+'</button><button class="lif" id="lf3" onclick="pakaiHN()" '+(used.hn?'disabled':'')+'>'+L.hint+'</button><button class="lif" style="background:#8a4b4b" onclick="berhenti()">'+L.ambil+' '+fmt(idx>0?HADIAH[idx-1]:0)+'</button></div></div>';}
function pilih(i){if(locked)return;locked=true;sfx.pilih();$('op'+i).classList.add('lock');sfx.kunci();
setTimeout(function(){const s=round[idx];
if(i===s.c){$('op'+i).classList.remove('lock');$('op'+i).classList.add('ok');sfx.benar();if(AMANIDX.indexOf(idx)>-1)sfx.aman();
if(idx===11){setTimeout(function(){selesai('menang');},1200);}else{idx++;locked=false;setTimeout(renderQ,1000);}}
else{$('op'+i).classList.add('no');$('op'+s.c).classList.add('ok');sfx.salah();setTimeout(function(){selesai('kalah');},1800);}
},1500);}
function pakaiFF(){if(used.ff||locked)return;used.ff=true;sfx.bantu();const s=round[idx];const salah=acak([0,1,2,3].filter(function(i){return i!==s.c;})).slice(0,2);salah.forEach(function(i){$('op'+i).classList.add('off');$('op'+i).disabled=true;});$('lf1').disabled=true;}
function pakaiPM(){if(used.pm||locked)return;used.pm=true;sfx.bantu();const s=round[idx];const base=[0,62,48,36][s.d]+Math.floor(Math.random()*15);let pct=[0,0,0,0];pct[s.c]=base;const o=[0,1,2,3].filter(function(i){return i!==s.c;});const w=o.map(function(){return Math.random()+.2;});const tw=w[0]+w[1]+w[2];o.forEach(function(i,j){pct[i]=Math.round((100-base)*w[j]/tw);});pct[s.c]=100-pct[o[0]]-pct[o[1]]-pct[o[2]];
$('extra').innerHTML='<div class="hint">'+o.map(function(i){return 'ABCD'[i]+' '+pct[i]+'%';}).join(' · ')+'<br>'+[0,1,2,3].map(function(i){return '<span style="display:inline-block;width:24%">'+('ABCD'[i])+'<div class="bar"><i style="width:'+pct[i]+'%"></i></div></span>';}).join('')+'</div>';$('lf2').disabled=true;}
function pakaiHN(){if(used.hn||locked)return;used.hn=true;sfx.bantu();$('extra').innerHTML+='<div class="hint">💡 '+round[idx][lang].h+'</div>';$('lf3').disabled=true;}
function berhenti(){sfx.klik();selesai('stop');}
function selesai(t){lastEnd=t;musikOff();let amt=0;
if(t==='menang')amt=1000000;
else if(t==='stop')amt=idx>0?HADIAH[idx-1]:0;
else amt=idx>8?500000:(idx>4?10000:0);
const best=parseInt(localStorage.getItem('kuis_best')||0);if(amt>best)localStorage.setItem('kuis_best',String(amt));
if(t==='menang')sfx.menang();
mode='end';window.lastAmt=amt;renderEnd(t);}
function renderEnd(t){show('scrEnd');const amt=window.lastAmt||0;
const gelar=amt>=1000000?(lang==='id'?'🏆 Sahabat Hijrah Sejati':'🏆 True Hijrah Companion'):amt>=500000?(lang==='id'?'🥇 Sahabat Berilmu':'🥇 Knowledgeable Companion'):amt>=10000?(lang==='id'?'🥈 Sahabat Pemula':'🥈 Beginner Companion'):(lang==='id'?'💪 Calon Sahabat':'💪 Aspiring Companion');
const head=t==='menang'?L.menang:(t==='kalah'?L.kalah:'🤝');
$('scrEnd').innerHTML='<div class="card" style="text-align:center"><h3>'+head+'</h3><div style="font-size:26px;font-weight:800;color:#2d6a4f;margin:10px 0">💰 '+fmt(amt)+'</div><div class="muted">'+(t==='stop'?L.stop:L.hantar)+': '+fmt(amt)+'</div><div class="muted">'+gelar+'</div><button class="btn" onclick="mulai()">'+L.lagi+'</button><button class="btn gold" onclick="renderHome()">'+L.menu+'</button></div>';}
function renderLearn(){mode='learn';musikOff();show('scrLearn');
let isi='';
if(learnTab==='n'){isi=NAMA.map(function(n,i){return '<div style="display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid #eee"><b style="min-width:24px;color:#2d6a4f">'+(i+1)+'</b><span class="ar">'+n[0]+'</span><span style="flex:1"><b>'+n[1]+'</b><br><span class="muted">'+(lang==='id'?n[2]:n[3])+'</span></span></div>';}).join('');}
else isi='<div style="line-height:1.6">'+PANDUAN[lang]+'</div>';
$('scrLearn').innerHTML='<div class="card"><button class="chip" onclick="renderHome()">'+L.kembali+'</button><button class="chip'+(learnTab==='n'?' on':'')+'" onclick="learnTab=\'n\';renderLearn()">'+L.tabN+'</button><button class="chip'+(learnTab==='p'?' on':'')+'" onclick="learnTab=\'p\';renderLearn()">'+L.tabP+'</button><div style="margin-top:10px">'+isi+'</div></div>';}
document.getElementById('bSnd').textContent=muted?'🔇':'';
$('hJudul').textContent=L.judul;
renderHome();
</script>
</body>
</html>
