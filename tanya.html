const CHAT=document.getElementById('chat');
let bah=localStorage.getItem('tanyaLang')||((navigator.language||'id').startsWith('id')?'id':'en');

function teks(e){
 if(e.D){const d=e.D;return (bah==='id'?'🤲 '+d.t:'🤲 '+d.te)+'\n'+d.a+'\n'+d.l+'\n'+(bah==='id'?d.m:d.me);}
 if(e.H)return '❝ '+e.H[bah]+' ❞';
 return e.J[bah];
}
function tulis(siapa,t,s){
 const d=document.createElement('div');d.className='p '+(siapa==='me'?'me':'bot');d.textContent=t;
 if(s){const sp=document.createElement('span');sp.className='src';sp.textContent='📖 '+s;d.appendChild(sp);}
 CHAT.appendChild(d);CHAT.scrollTop=CHAT.scrollHeight;
}
const norm=s=>s.toLowerCase().replace(/[^a-z0-9\s]/g,' ').trim();
function cari(q){
 q=norm(q);if(!q)return null;
 const toks=q.split(/\s+/);let best=null,bs=0;
 for(const e of P){
  let sc=0;
  for(const kw of e.k.concat(e.ke)){
   if(q.includes(kw)||kw.includes(q))sc+=3;
   else if(toks.some(t=>t.length>3&&kw.includes(t)))sc+=2;
  }
  const hay=norm(teks(e));
  for(const t of toks)if(t.length>3&&hay.includes(t))sc+=1;
  if(sc>bs){bs=sc;best=e;}
 }
 return bs>=2?best:null;
}
async function kirim(){
 const inp=document.getElementById('inp');const q=inp.value.trim();if(!q)return;
 inp.value='';tulis('me',q);
 const e=cari(q);
 if(e){tulis('bot',teks(e),e.S[bah]||e.S.id);return;}
 if(URL_OTAK){
  try{
   const r=await fetch(URL_OTAK,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({q})});
   const d=await r.json();tulis('bot',d.jawaban,d.sumber||'');
  }catch(err){tulis('bot',UI[bah].err);}
  return;
 }
 tulis('bot',UI[bah].kosong);
}
function setBah(b){
 bah=b;localStorage.setItem('tanyaLang',b);
 document.documentElement.lang=b;
 const u=UI[b];
 document.getElementById('judul').textContent=u.judul;
 document.getElementById('back').href=u.back;
 document.getElementById('inp').placeholder=u.ph;
 document.getElementById('bID').classList.toggle('on',b==='id');
 document.getElementById('bEN').classList.toggle('on',b==='en');
 const cb=document.getElementById('chips');cb.innerHTML='';
 u.chips.forEach(c=>{const bt=document.createElement('button');bt.textContent=c;bt.onclick=()=>{document.getElementById('inp').value=c;kirim();};cb.appendChild(bt);});
}
document.getElementById('frm').addEventListener('submit',ev=>{ev.preventDefault();kirim();});
setBah(bah);
tulis('bot',UI[bah].salam);
</script>
