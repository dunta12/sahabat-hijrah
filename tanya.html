err:'Maaf, sambunganku ke otak sedang terputus. Coba lagi sebentar lagi ya.',

salam:'Assalamu\'alaikum 🌿 I am the discussion companion of Sahabat Hijrah. How do you feel today?',

err:'Sorry, my link to the brain is down. Please try again in a moment.',

/* PUSTAKA 59 butir: fiqih + doa + hikmah + fitur, dwibahasa */
const P=[
{k:['sholat wajib','rakaat sholat','shalat wajib'],ke:['obligatory prayer','rakah','how many rakah'],J:{id:'Sholat wajib ada lima waktu dalam sehari semalam: Subuh 2 rakaat, Zuhur 4, Asar 4, Magrib 3, Isya 4 — total 17 rakaat. Kewajibannya ditetapkan saat Isra Mikraj.',en:'The obligatory prayers are five per day and night: Fajr 2 rakahs, Dhuhr 4, Asr 4, Maghrib 3, Isha 4 — 17 rakahs in total. They were made obligatory at the Isra\' and Mi\'raj.'},S:{id:'HR. Bukhari no. 349 & Muslim no. 162',en:'Bukhari no. 349 & Muslim no. 162'}},
{k:['sholat jumat','jumatan'],ke:['friday prayer','jumuah','jummah'],J:{id:'Sholat Jumat wajib bagi laki-laki muslim yang baligh, berakal, dan menetap; dua rakaat berjamaah menggantikan Zuhur, didahului dua khutbah.',en:'Friday prayer is obligatory upon Muslim men who are adult, sane, and resident; two rakahs in congregation replacing Dhuhr, preceded by two sermons.'},S:{id:'QS. Al-Jumu\'ah: 9',en:'Qur\'an 62:9'}},
{k:['sholat berjamaah','jamaah'],ke:['congregation','jamaah prayer'],J:{id:'Sholat berjamaah melebihi sholat sendirian sebanyak 27 derajat.',en:'Prayer in congregation surpasses praying alone by 27 degrees.'},S:{id:'HR. Bukhari no. 645 & Muslim no. 650',en:'Bukhari no. 645 & Muslim no. 650'}},
{k:['witir','sholat witir'],ke:['witr','witr prayer'],J:{id:'Sholat witir menutup sholat malam dengan rakaat ganjil (1, 3, atau lebih); waktunya setelah Isya hingga menjelang Subuh.',en:'Witr closes the night prayer with an odd number of rakahs (1, 3, or more); its time is after Isha until just before Fajr.'},S:{id:'HR. Bukhari no. 998 & Muslim no. 751',en:'Bukhari no. 998 & Muslim no. 751'}},
{k:['dhuha','sholat dhuha'],ke:['duha','ishraq'],J:{id:'Sholat dhuha dikerjakan saat matahari meninggi hingga menjelang Zuhur; minimal 2 rakaat, wasiat Nabi untuk dijaga.',en:'Duha prayer is prayed from mid-morning until just before Dhuhr; minimum 2 rakahs, a practice the Prophet urged to keep.'},S:{id:'HR. Muslim no. 720',en:'Muslim no. 720'}},
{k:['rawatib','sunnah rawatib'],ke:['rawatib','sunnah before prayer'],J:{id:'Sunnah rawatib mengiringi sholat wajib; dua belas rakaat sehari semalam dibangunkan rumah di surga: 4 sebelum Zuhur, 2 sesudahnya, 2 sesudah Magrib, 2 sesudah Isya, 2 sebelum Subuh.',en:'Rawatib sunnah surrounds the obligatory prayers; twelve rakahs a day build a house in Paradise: 4 before Dhuhr, 2 after, 2 after Maghrib, 2 after Isha, 2 before Fajr.'},S:{id:'HR. Muslim no. 728 & Tirmidzi no. 414',en:'Muslim no. 728 & Tirmidhi no. 414'}},
{k:['tahajud'],ke:['tahajjud','night prayer'],J:{id:'Sholat tahajud dikerjakan setelah bangun tidur di waktu malam, utamanya sepertiga malam terakhir; rakaatnya berpasangan, minimal 2 rakaat.',en:'Tahajjud is prayed after waking from sleep at night, best in the last third of the night; its rakahs are in pairs, minimum 2.'},S:{id:'QS. Al-Isra: 79; HR. Bukhari no. 1130',en:'Qur\'an 17:79; Bukhari no. 1130'}},
{k:['puasa ramadhan','hukum puasa'],ke:['ramadan fasting','fasting ruling','ramadhan'],J:{id:'Puasa Ramadhan hukumnya wajib bagi setiap muslim yang baligh, berakal, dan mampu.\n"Dihwajibkan atas kamu berpuasa, sebagaimana diwajibkan atas orang-orang sebelum kamu, agar kamu bertakwa."',en:'Fasting in Ramadan is obligatory upon every Muslim who is adult, sane, and able.\n"O you who have believed, decreed upon you is fasting as it was decreed upon those before you that you may become righteous."'},S:{id:'QS. Al-Baqarah: 183',en:'Qur\'an 2:183'}},
{k:['puasa senin kamis','senin kamis'],ke:['monday thursday','fast monday'],J:{id:'Puasa sunnah Senin dan Kamis dianjurkan; amal dilaporkan pada dua hari itu dan Nabi senang berpuasa saat amalnya dilaporkan.',en:'Fasting Mondays and Thursdays is recommended; deeds are presented on those two days and the Prophet loved to fast when his deeds were presented.'},S:{id:'HR. Tirmidzi no. 745',en:'Tirmidhi no. 745'}},
{k:['puasa syawal','syawal'],ke:['shawwal fasting','six days'],J:{id:'Puasa enam hari di bulan Syawal setelah Ramadhan pahalanya seperti puasa setahun penuh.',en:'Fasting six days of Shawwal after Ramadan is rewarded like fasting a whole year.'},S:{id:'HR. Muslim no. 1164',en:'Muslim no. 1164'}},
{k:['lailatul qadar'],ke:['laylatul qadr','night of decree'],J:{id:'Lailatul qadar lebih baik dari seribu bulan; carilah di malam-malam ganjil sepuluh terakhir Ramadhan.',en:'The Night of Decree is better than a thousand months; seek it in the odd nights of the last ten of Ramadan.'},S:{id:'QS. Al-Qadr: 3; HR. Bukhari no. 2017',en:'Qur\'an 97:3; Bukhari no. 2017'}},
{k:['zakat fitrah'],ke:['zakat al-fitr','fitrah'],J:{id:'Zakat fitrah dikeluarkan sebelum sholat Idulfitri, berupa makanan pokok sekitar 2,5 kg (atau 3,5 liter) beras per jiwa, bagi yang mampu maupun yang ditanggung.',en:'Zakat al-fitr is paid before the Eid prayer, in staple food of about 2.5 kg (or 3.5 litres) of rice per person, for those able and those they support.'},S:{id:'HR. Bukhari no. 1503 & Muslim no. 984',en:'Bukhari no. 1503 & Muslim no. 984'}},
{k:['zakat mal','zakat harta','nisab'],ke:['zakat on wealth','nisab','zakat mal'],J:{id:'Zakat mal wajib atas harta yang mencapai nisab dan haul; kadarnya 2,5% untuk emas, perak, dan uang simpanan.',en:'Zakat on wealth is due when savings reach nisab and one lunar year; 2.5% for gold, silver, and saved money.'},S:{id:'QS. At-Taubah: 103',en:'Qur\'an 9:103'}},
{k:['batal wudhu','membatalkan wudhu'],ke:['invalidates wudhu','nullifies wudu','wudhu','wudu'],J:{id:'Yang membatalkan wudhu: keluar sesuatu dari dua jalan, tidur nyenyak tanpa sisa kesadaran, hilang akal, dan menyentuh kemaluan dengan telapak tangan menurut sebagian ulama.',en:'What nullifies wudhu: anything exiting from the two private passages, deep sleep without awareness, loss of sanity, and touching the private parts with the palm according to some scholars.'},S:{id:'QS. Al-Maidah: 6; HR. Tirmidzi no. 75',en:'Qur\'an 5:6; Tirmidhi no. 75'}},
{k:['tayamum'],ke:['tayammum','no water'],J:{id:'Bila tidak ada air atau berhalangan memakainya, bersuci diganti tayamum: usap wajah dan dua tangan dengan debu yang suci.',en:'When water is absent or cannot be used, purification is replaced by tayammum: wipe the face and both hands with pure dust.'},S:{id:'QS. Al-Maidah: 6',en:'Qur\'an 5:6'}},
{k:['mandi wajib','mandi junub','junub'],ke:['ghusl','major impurity','janabah'],J:{id:'Mandi wajib menghilangkan hadas besar: niat, lalu meratakan air ke seluruh tubuh termasuk rambut dan kulit.',en:'Ghusl removes major impurity: intention, then letting water reach the whole body including hair and skin.'},S:{id:'QS. Al-Maidah: 6; QS. An-Nisa: 43',en:'Qur\'an 5:6; 4:43'}},
{k:['qurban','kurban'],ke:['qurban','udhiyah','sacrifice'],J:{id:'Qurban disyariatkan bagi yang mampu pada 10-13 Zulhijah; satu kambing untuk satu orang, sapi untuk tujuh orang.',en:'Qurban is prescribed for those able on 10-13 Dhul-Hijjah; one sheep for one person, a cow for seven.'},S:{id:'QS. Al-Kautsar: 2',en:'Qur\'an 108:2'}},
{k:['haji','umrah'],ke:['hajj','umrah','pilgrimage'],J:{id:'Haji wajib sekali seumur hidup bagi yang mampu secara biaya, fisik, dan keamanan perjalanan; umrah adalah kunjungan sunnah ke Baitullah.',en:'Hajj is obligatory once in a lifetime for those able in cost, body, and safe travel; umrah is a voluntary visit to the House of Allah.'},S:{id:'QS. Ali Imran: 97',en:'Qur\'an 3:97'}},
{k:['riba','bunga'],ke:['riba','interest','usury'],J:{id:'Riba diharamkan dalam segala bentuk penambahan yang disyaratkan pada utang-piutang; jual beli dihalalkan, riba diharamkan.',en:'Riba is forbidden in every form of stipulated increase on loans; trade is made lawful and riba unlawful.'},S:{id:'QS. Al-Baqarah: 275',en:'Qur\'an 2:275'}},
{k:['sedekah'],ke:['sadaqah','charity','sedekah'],J:{id:'Sedekah adalah pemberian sukarela tanpa kadar dan waktu tertentu; ia tidak menggugurkan zakat yang wajib, tetapi melipatgandakan pahala dan membersihkan hati.',en:'Sadaqah is voluntary giving with no fixed amount or time; it does not replace obligatory zakat, but multiplies reward and purifies the heart.'},S:{id:'QS. Al-Baqarah: 261',en:'Qur\'an 2:261'}},
{k:['musik'],ke:['music','instruments','maazif'],J:{id:'Soal musik termasuk perkara yang ulama berbeda pendapat: sebagian mengharamkan alat musik tertentu berdasar hadits tentang ma\'azif, sebagian lain membolehkan selama liriknya baik dan tidak melalaikan.\nKarena khilaf, pilihlah sikap yang paling menenangkan hatimu dan hormati pilihan saudaramu. Wallahu a\'lam.',en:'Music is a matter where scholars differ: some prohibit certain instruments based on the hadith on ma\'azif, others permit it as long as the lyrics are good and it does not distract from worship.\nSince opinions differ, choose what settles your heart and respect your brother\'s choice. Wallahu a\'lam.'},S:{id:'HR. Bukhari no. 5590 (muallaq)',en:'Bukhari no. 5590 (muallaq)'}},
{k:['niat'],ke:['intention','niyyah','niat'],J:{id:'Amal tergantung niatnya: sahnya ibadah ditentukan niat di hati; melafalkannya cukup dalam hati, tidak wajib diucapkan keras.',en:'Deeds are by intentions: the validity of worship is determined by the intention in the heart; keeping it in the heart suffices, it need not be spoken aloud.'},S:{id:'HR. Bukhari no. 1 & Muslim no. 1907',en:'Bukhari no. 1 & Muslim no. 1907'}},
{k:['menuntut ilmu','belajar'],ke:['seeking knowledge','knowledge','study'],J:{id:'Menuntut ilmu wajib bagi setiap muslim; jalan mencari ilmu dimudahkan Allah menuju surga.',en:'Seeking knowledge is obligatory upon every Muslim; the path of seeking knowledge is eased by Allah toward Paradise.'},S:{id:'HR. Ibnu Majah no. 224',en:'Ibn Majah no. 224'}},
{k:['menjaga lisan','lisan','berkata'],ke:['tongue','speech','speak good'],J:{id:'Barangsiapa beriman kepada Allah dan hari akhir, hendaklah ia berkata baik atau diam.',en:'Whoever believes in Allah and the Last Day should speak good or remain silent.'},S:{id:'HR. Bukhari no. 6018 & Muslim no. 47',en:'Bukhari no. 6018 & Muslim no. 47'}},
{k:['orang tua','birrul walidain','bakti'],ke:['parents','honour parents','birr'],J:{id:'Berbakti kepada kedua orang tua adalah amal utama setelah sholat tepat waktu; ucapkanlah kata-kata mulia kepada keduanya.',en:'Honouring both parents is a chief deed after prayer on time; speak noble words to them.'},S:{id:'QS. Al-Isra: 23-24',en:'Qur\'an 17:23-24'}},
{k:['istikharah'],ke:['istikharah','guidance prayer'],J:{id:'Sholat istikharah dua rakaat memohon kepada Allah pilihan terbaik dalam urusan yang membingungkan.',en:'Two rakahs of istikharah ask Allah for the best choice in a confusing matter.'},S:{id:'HR. Bukhari no. 6382',en:'Bukhari no. 6382'}},
{k:['dzikir pagi petang','dzikir pagi','dzikir petang'],ke:['morning dhikr','evening adhkar'],J:{id:'Dzikir pagi dan petang menjaga hari dan malam seorang muslim; perbanyaklah mengingat Allah hingga matahari terbit dan terbenam.',en:'Morning and evening dhikr guard a Muslim\'s day and night; remember Allah much until sunrise and sunset.'},S:{id:'QS. Al-Ahzab: 41-42',en:'Qur\'an 33:41-42'}},
{k:['dzikir setelah sholat','dzikir sholat'],ke:['dhikr after prayer','tasbih after salah'],J:{id:'Setelah sholat wajib: 33 subhanallah, 33 alhamdulillah, 33 allahu akbar, ditutup la ilaha illallah; mengampuni dosa meski sebanyak buih lautan.',en:'After obligatory prayer: 33 subhanallah, 33 alhamdulillah, 33 allahu akbar, closed with la ilaha illallah; it forgives sins even like the foam of the sea.'},S:{id:'HR. Muslim no. 595',en:'Muslim no. 595'}},
{k:['tartil','membaca quran','cara baca quran'],ke:['tartil','recite quran','recitation'],J:{id:'Membaca Al-Quran dianjurkan tartil dan perlahan agar maknanya meresap di hati.',en:'Reciting the Qur\'an is recommended slowly and measured so its meaning settles in the heart.'},S:{id:'QS. Al-Muzzammil: 4',en:'Qur\'an 73:4'}},
{k:['doa sebelum makan','doa makan'],ke:['before eating','eating','food','meal'],D:{t:'Sebelum Makan',te:'Before Eating',a:'اللَّهُمَّ بَارِكْ لَنَا فِيمَا رَزَقْتَنَا وَقِنَا عَذَابَ النَّارِ',l:'Allahumma barik lana fima razaqtana wa qina adzaban nar',m:'Ya Allah, berkahilah rezeki kami dan peliharalah kami dari siksa neraka.',me:'O Allah, bless us in what You have provided for us and protect us from the punishment of the Fire.'},S:{id:'Sahabat Hijrah • Doa Harian',en:'Sahabat Hijrah • Daily Du\'as'}},
{k:['doa sesudah makan','doa setelah makan'],ke:['after eating','finished eating'],D:{t:'Sesudah Makan',te:'After Eating',a:'الْحَمْدُ لِلَّهِ الَّذِي أَطْعَمَنَا وَسَقَانَا وَجَعَلَنَا مُسْلِمِينَ',l:'Alhamdulillahilladzi ath\'amana wa saqana wa ja\'alana muslimin',m:'Segala puji bagi Allah yang memberi kami makan dan minum serta menjadikan kami muslim.',me:'All praise is for Allah who fed us, gave us drink, and made us Muslims.'},S:{id:'Sahabat Hijrah • Doa Harian',en:'Sahabat Hijrah • Daily Du\'as'}},
{k:['doa sebelum tidur','doa tidur'],ke:['before sleeping','sleep','bedtime'],D:{t:'Sebelum Tidur',te:'Before Sleeping',a:'بِاسْمِكَ اللَّهُمَّ أَحْيَا وَأَمُوتُ',l:'Bismikallahumma ahya wa amut',m:'Dengan nama-Mu ya Allah aku hidup dan aku mati.',me:'In Your name, O Allah, I live and I die.'},S:{id:'Sahabat Hijrah • Doa Harian',en:'Sahabat Hijrah • Daily Du\'as'}},
{k:['doa bangun tidur'],ke:['waking up','wake up','morning dua'],D:{t:'Bangun Tidur',te:'Waking Up',a:'الْحَمْدُ لِلَّهِ الَّذِي أَحْيَانَا بَعْدَ مَا أَمَاتَنَا وَإِلَيْهِ النُّشُورُ',l:'Alhamdulillahilladzi ahyaana ba\'da maa amaatana wa ilaihin nusyur',m:'Segala puji bagi Allah yang menghidupkan kami setelah mematikan kami, dan kepada-Nya kami dibangkitkan.',me:'All praise is for Allah who gave us life after death, and to Him is the resurrection.'},S:{id:'Sahabat Hijrah • Doa Harian',en:'Sahabat Hijrah • Daily Du\'as'}},
{k:['doa masuk kamar mandi','kamar mandi','toilet'],ke:['entering toilet','bathroom','toilet'],D:{t:'Masuk Kamar Mandi',te:'Entering the Toilet',a:'اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْخُبُثِ وَالْخَبَائِثِ',l:'Allahumma inni a\'udzu bika minal khubutsi wal khaba\'its',m:'Ya Allah, aku berlindung kepada-Mu dari godaan setan laki-laki dan perempuan.',me:'O Allah, I seek refuge in You from the male and female devils.'},S:{id:'Sahabat Hijrah • Doa Harian',en:'Sahabat Hijrah • Daily Du\'as'}},
{k:['doa keluar kamar mandi'],ke:['leaving toilet','after bathroom'],D:{t:'Keluar Kamar Mandi',te:'Leaving the Toilet',a:'غُفْرَانَكَ',l:'Ghufranaka',m:'Aku mohon ampunan-Mu.',me:'I seek Your forgiveness.'},S:{id:'Sahabat Hijrah • Doa Harian',en:'Sahabat Hijrah • Daily Du\'as'}},
{k:['doa keluar rumah','keluar rumah'],ke:['leaving home','leave the house'],D:{t:'Keluar Rumah',te:'Leaving Home',a:'بِسْمِ اللَّهِ تَوَكَّلْتُ عَلَى اللَّهِ وَلَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ',l:'Bismillahi tawakkaltu \'alallahi wa laa hawla wa laa quwwata illa billah',m:'Dengan nama Allah, aku bertawakal kepada Allah; tiada daya dan kekuatan kecuali dengan Allah.',me:'In the name of Allah, I place my trust in Allah; there is no might nor power except with Allah.'},S:{id:'Sahabat Hijrah • Doa Harian',en:'Sahabat Hijrah • Daily Du\'as'}},
{k:['doa masuk masjid','masjid'],ke:['entering mosque','mosque'],D:{t:'Masuk Masjid',te:'Entering the Mosque',a:'اللَّهُمَّ افْتَحْ لِي أَبْوَابَ رَحْمَتِكَ',l:'Allahummaftah li abwaba rahmatik',m:'Ya Allah, bukakanlah untukku pintu-pintu rahmat-Mu.',me:'O Allah, open for me the doors of Your mercy.'},S:{id:'Sahabat Hijrah • Doa Harian',en:'Sahabat Hijrah • Daily Du\'as'}},

const CHAT=document.getElementById('chat');
let bah=localStorage.getItem('tanyaLang')||((navigator.language||'id').startsWith('id')?'id':'en');

function teks(e){
 if(e.D){const d=e.D;return (bah==='id'?'🤲 '+d.t:'🤲 '+d.te)+'\n'+d.a+'\n'+d.l+'\n'+(bah==='id'?d.m:d.me);}
 if(e.H)return '❝ '+e.H[bah]+' ❞';
 return e.J[bah];
}
function tulis(siapa,t,s){
 const d=document.createElement('div');d.className='p '+(siapa==='me'?'me':'bot');d.textContent=t;
 if(s){const sp=document.createElement('span');sp.className='src';sp.textContent='📖 '+s;d.appendChild(sp);}
 CHAT.appendChild(d);CHAT.scrollTop=CHAT.scrollHeight;
}
function titik(){const d=document.createElement('div');d.className='p bot typing';d.innerHTML='<span></span><span></span><span></span>';CHAT.appendChild(d);CHAT.scrollTop=CHAT.scrollHeight;return d;}
 const norm=s=>s.toLowerCase().replace(/[^a-z0-9\s]/g,' ').trim();
function cari(q){
 q=norm(q);if(!q)return null;
 const toks=q.split(/\s+/);let best=null,bs=0;
 for(const e of P){
  let sc=0;
  for(const kw of e.k.concat(e.ke)){
   if(q.includes(kw)||kw.includes(q))sc+=3;
   else if(toks.some(t=>t.length>3&&kw.includes(t)))sc+=2;
  }
  const hay=norm(teks(e));
  for(const t of toks)if(t.length>3&&hay.includes(t))sc+=1;
  if(sc>bs){bs=sc;best=e;}
 }
 return bs>=2?best:null;
}
const URL_KADO=URL_OTAK.replace(/\/tanya$/,'')+'/kado';
function tombolKado(){
if(CHAT.querySelector('.kadoBtn'))return;
const d=document.createElement('div');d.className='p bot';
const bt=document.createElement('button');bt.className='kadoBtn';
bt.style.cssText='background:#174d3b;color:#fff;border:0;border-radius:12px;padding:10px 14px;font-size:14px;width:100%;cursor:pointer;';
bt.textContent='🎁 Tonton iklan • +5 pertanyaan';
bt.onclick=()=>{bt.disabled=true;bt.textContent='Memuat iklan...';try{Android.mintaRewarded();}catch(e){bt.disabled=false;bt.textContent='🎁 Tonton iklan • +5 pertanyaan';}};
d.appendChild(bt);CHAT.appendChild(d);CHAT.scrollTop=CHAT.scrollHeight;
}
window.onRewardSelesai=async()=>{
const bt=CHAT.querySelector('.kadoBtn');
try{
const r=await fetch(URL_KADO,{method:'POST'});
const h=await r.json();
if(h.ok){if(bt){bt.closest('.p').remove();}tulis('bot','🎁 Kado diterima! Sisa jatahmu hari ini: '+h.sisa+' pertanyaan.');}
else{if(bt){bt.disabled=false;bt.textContent='🎁 Tonton iklan • +5 pertanyaan';}tulis('bot',h.alasan||'Kado gagal, coba lagi nanti.');}
}catch(e){if(bt){bt.disabled=false;bt.textContent='🎁 Tonton iklan • +5 pertanyaan';}tulis('bot','Kado gagal dikirim, coba lagi nanti.');}
};
 function rapikan(s){
if(!s||s.indexOf('Kode ')!==0)return s;
const c=s.slice(5,8);
if(bah==='id'){
if(c==='429')return '⏳ Maaf sahabatku, jatah harianku sedang penuh sekali hari ini. InsyaAllah besok pagi aku sehat kembali, coba lagi ya.';
if(c==='503')return '⏳ Ruang tunggu sedang ramai sekali sebentar ini. Coba beberapa menit lagi ya, aku tidak ke mana-mana.';
return '⏳ Aku sedang kurang sehat sebentar. Coba lagi beberapa saat lagi ya, sahabatku.';
}
if(c==='429')return '⏳ Sorry my friend, my daily quota is full today. I should be healthy again tomorrow morning, please try again.';
if(c==='503')return '⏳ The waiting room is very crowded right now. Please try again in a few minutes, I am not going anywhere.';
return '⏳ I am feeling a little unwell right now. Please try again in a moment, my friend.';
}
 async function kirim(){
 const inp=document.getElementById('inp');const q=inp.value.trim();if(!q)return;
 inp.value='';tulis('me',q);
 const e=cari(q);
 if(e){tulis('bot',teks(e),e.S[bah]||e.S.id);return;}
if(URL_OTAK){
const tp=titik();
try{
const r=await fetch(URL_OTAK,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({q})});
const d=await r.json();tp.remove();const jw=(d.jawaban||'').replace(/\*/g,'');tulis('bot',rapikan(jw),d.sumber||'');
if((d.jawaban||'').indexOf('Jatah')===0&&window.Android)tombolKado();
}catch(err){tp.remove();tulis('bot',UI[bah].err);}
return;
   }
 tulis('bot',UI[bah].kosong);
}
function setBah(b){
 bah=b;localStorage.setItem('tanyaLang',b);
 document.documentElement.lang=b;
 const u=UI[b];
 document.getElementById('judul').textContent=u.judul;
 document.getElementById('back').href=u.back;
 document.getElementById('inp').placeholder=u.ph;
 document.getElementById('bID').classList.toggle('on',b==='id');
 document.getElementById('bEN').classList.toggle('on',b==='en');
 const cb=document.getElementById('chips');cb.innerHTML='';
 u.chips.forEach(c=>{const bt=document.createElement('button');bt.textContent=c;bt.onclick=()=>{document.getElementById('inp').value=c;kirim();};cb.appendChild(bt);});
 CHAT.innerHTML='';
 tulis('bot',u.salam);
}
document.getElementById('frm').addEventListener('submit',ev=>{ev.preventDefault();kirim();});
setBah(bah);
</script>
