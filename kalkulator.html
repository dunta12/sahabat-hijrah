<html lang="id">

<meta charset="UTF-8">

<title>Kalkulator & Alat — Sahabat Hijrah</title>

<style>
:root{
  --green:#1e5b46;
  --yellow:#ffd200;
  --bg:#efece4;
  --card:#f8f8f6;
  --text:#21302b;
  --muted:#7d8a83
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box
}

body{
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:var(--bg);
  color:var(--text);
  padding-bottom:24px
}

header{
  position:sticky;
  top:0;
  z-index:5;
  background:var(--green);
  color:#fff;
  display:flex;
  align-items:center;
  gap:10px;
  padding:14px 16px
}

header a{
  color:#fff;
  text-decoration:none;
  font-size:22px;
  line-height:1
}

header h1{
  font-size:18px;
  flex:1
}

header button{
  background:rgba(255,255,255,.15);
  border:1px solid rgba(255,255,255,.4);
  color:#fff;
  border-radius:50%;
  width:38px;
  height:38px;
  font-size:17px
}

.wrap{
  padding:14px 16px 0
}

.card{
  background:var(--card);
  border-radius:18px;
  padding:16px;
  box-shadow:0 1px 3px rgba(0,0,0,.08)
}

h3.cat{
  font-size:13px;
  color:var(--muted);
  margin:14px 2px 8px;
  font-weight:700
}

h3.cat:first-child{
  margin-top:0
}

.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px
}

.tool{
  background:#fff;
  border-radius:14px;
  padding:14px;
  text-align:left;
  border:none;
  box-shadow:0 1px 2px rgba(0,0,0,.06);
  cursor:pointer
}

.tool .ic{
  font-size:26px;
  display:block;
  margin-bottom:6px
}

.tool b{
  font-size:14px;
  color:var(--text)
}

.back{
  background:none;
  border:none;
  color:var(--green);
  font-size:14px;
  font-weight:700;
  margin-bottom:10px;
  cursor:pointer
}

.lbl{
  font-size:12px;
  color:var(--muted);
  margin:8px 0 4px
}

input,
select{
  width:100%;
  padding:10px;
  border-radius:10px;
  border:1px solid #cfd8d3;
  background:#fff;
  font-size:15px;
  color:var(--text)
}

.irow{
  display:flex;
  gap:8px;
  margin-bottom:8px
}

.irow input,
.irow select{
  flex:1
}

.res{
  margin-top:12px;
  background:#e2efe8;
  border-radius:12px;
  padding:12px;
  font-size:15px;
  color:var(--green);
  font-weight:700;
  text-align:center;
  min-height:20px
}

.res small{
  display:block;
  font-weight:500;
  color:var(--muted);
  margin-top:4px
}

.seg{
  display:flex;
  gap:6px;
  margin:8px 0
}

.seg button{
  flex:1;
  padding:10px;
  border-radius:12px;
  border:1px solid #cfd8d3;
  background:#fff;
  font-size:13px;
  color:var(--text);
  cursor:pointer
}

.seg button.on{
  background:var(--green);
  color:#fff;
  border-color:var(--green)
}

.disp{
  background:#fff;
  border-radius:14px;
  padding:14px;
  text-align:right;
  margin-bottom:10px;
  min-height:74px;
  display:flex;
  flex-direction:column;
  justify-content:flex-end
}

.disp small{
  color:var(--muted);
  font-size:13px;
  min-height:16px
}

.disp b{
  font-size:34px;
  font-weight:700;
  word-break:break-all
}

.keys{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px
}

.keys button{
  border:none;
  border-radius:14px;
  padding:16px 0;
  font-size:20px;
  background:#fff;
  color:var(--text);
  box-shadow:0 1px 2px rgba(0,0,0,.08);
  cursor:pointer
}

.keys button.op{
  background:#e2efe8;
  color:var(--green);
  font-weight:700
}

.keys button.eq{
  background:var(--yellow);
  font-weight:800
}

.keys button.cl{
  background:var(--green);
  color:#fff
}

.big{
  font-size:40px;
  font-weight:800;
  text-align:center;
  color:var(--green);
  margin:14px 0;
  font-variant-numeric:tabular-nums
}

.row{
  display:flex;
  gap:8px;
  justify-content:center
}

.row button{
  border:none;
  border-radius:12px;
  padding:12px 18px;
  font-size:15px;
  font-weight:600;
  background:var(--green);
  color:#fff;
  cursor:pointer
}

.row button.alt{
  background:#e2efe8;
  color:var(--green)
}
</style>
</head>

/* =========================

========================= */

let a=null;
let op=null;
let cur='0';
let fresh=false;

const rd=v=>+Number(v).toPrecision(12);

function apply(x,o,y){
return rd(
o==='+'?x+y:
o==='−'?x-y:
o==='×'?x*y:
y===0?NaN:x/y
);
}

function setNum(r){
cur=isFinite(r)?String(r):'Error';
}

function disp(){
const e=$('expr');
const v=$('val');

if(!e)return;

e.textContent=
(a!==null&&op)
?(a+' '+op)
:'';

v.textContent=cur;
}

function calc(b){

if(b>='0'&&b<='9'){

cur=
(cur==='0'||cur==='Error'||fresh)
?b
:cur+b;

fresh=false;

}

else if(b==='.'){
if(fresh||cur==='Error'){
cur='0.';
fresh=false;
}
else if(!cur.includes('.')){
cur+='.';
}
}

else if(b==='C'){
cur='0';
a=null;
op=null;
fresh=false;
}

else if(b==='⌫'){
cur=
(cur.length>1&&cur!=='Error')
?cur.slice(0,-1)
:'0';
}

else if(b==='±'){
if(cur!=='0'&&cur!=='Error'){
cur=cur.startsWith('-')
?cur.slice(1)
:'-'+cur;
}
}

else if(b==='%'){
setNum(rd(parseFloat(cur)/100));
fresh=true;
}

else if('÷×−+'.includes(b)){

if(cur==='Error')cur='0';

const v=parseFloat(cur);

if(a!==null&&op&&!fresh){
setNum(apply(a,op,v));
}
else{
setNum(v);
}

if(cur!=='Error'){
a=parseFloat(cur);
}

op=b;
fresh=true;

}

else if(b==='='){

if(op!==null&&a!==null){

setNum(
apply(
a,
op,
parseFloat(cur)
)
);

a=null;
op=null;
fresh=true;

}
}

disp();
}

const ROM=[
[1000,'M'],
[900,'CM'],
[500,'D'],
[400,'CD'],
[100,'C'],
[90,'XC'],
[50,'L'],
[40,'XL'],
[10,'X'],
[9,'IX'],
[5,'V'],
[4,'IV'],
[1,'I']
];

function toRoman(n){

let s='';

for(const[v,r]of ROM){

while(n>=v){
s+=r;
n-=v;
}

}

return s;
}

function fromRoman(s){

s=(s||'').toUpperCase().trim();

if(!s)return NaN;

let t=0;
let i=0;

for(let k=0;k<ROM.length;k++){

const[v,r]=ROM[k];

while(s.startsWith(r,i)){
t+=v;
i+=r.length;
}

}

return i===s.length?t:NaN;
}

function beep(){

try{

const C=
new(
window.AudioContext||
window.webkitAudioContext
)();

for(let i=0;i<3;i++){

const o=C.createOscillator();
const g=C.createGain();

o.connect(g);
g.connect(C.destination);

o.frequency.value=880;

const t=
C.currentTime+
i*0.45;

g.gain.setValueAtTime(
0.001,
t
);

g.gain.exponentialRampToValueAtTime(
0.4,
t+0.02
);

g.gain.exponentialRampToValueAtTime(
0.001,
t+0.35
);

o.start(t);
o.stop(t+0.4);

}

}
catch(e){}
}

(+$('tmM').value||0)*60+
(+$('tmS').value||0);

if(tot<=0)return;

const end=
Date.now()+
tot*1000;

tmRun=true;

const b=$('tmGo');

if(b){
b.textContent=L.pause;
}

tmIv=setInterval(
()=>{

const left=
end-Date.now();

if(left<=0){

clearInterval(tmIv);

tmRun=false;

tmShow(0);

const e=$('tmDisp');

if(e){
e.textContent=L.done;
}

beep();

const g=$('tmGo');

if(g){
g.textContent=L.start;
}

}
else{

tmShow(left);

}

},
200
);

}

function tmReset(){

clearInterval(tmIv);

tmRun=false;

const b=$('tmGo');

if(b){
b.textContent=L0().start;
}

tmInput();

}

function L0(){
return T[lang];
}
