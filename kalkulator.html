<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1e5b46">
<title>Kalkulator & Alat</title>

<style>
:root{
  --green:#1e5b46;
  --yellow:#ffd200;
  --bg:#efece4;
  --card:#f8f8f6;
  --text:#21302b;
  --muted:#7d8a83
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box
}

body{
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:var(--bg);
  color:var(--text);
  padding-bottom:24px
}

header{
  position:sticky;
  top:0;
  z-index:5;
  background:var(--green);
  color:#fff;
  display:flex;
  align-items:center;
  gap:10px;
  padding:14px 16px
}

header a{
  color:#fff;
  text-decoration:none;
  font-size:22px;
  line-height:1
}

header h1{
  font-size:18px;
  flex:1
}

header button{
  background:rgba(255,255,255,.15);
  border:1px solid rgba(255,255,255,.4);
  color:#fff;
  border-radius:50%;
  width:38px;
  height:38px;
  font-size:17px
}

.wrap{
  padding:14px 16px 0
}

.card{
  background:var(--card);
  border-radius:18px;
  padding:16px;
  box-shadow:0 1px 3px rgba(0,0,0,.08)
}

h3.cat{
  font-size:13px;
  color:var(--muted);
  margin:14px 2px 8px;
  font-weight:700
}

h3.cat:first-child{
  margin-top:0
}

.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px
}

.tool{
  background:#fff;
  border-radius:14px;
  padding:14px;
  text-align:left;
  border:none;
  box-shadow:0 1px 2px rgba(0,0,0,.06);
  cursor:pointer
}

.tool .ic{
  font-size:26px;
  display:block;
  margin-bottom:6px
}

.tool b{
  font-size:14px;
  color:var(--text)
}

.back{
  background:none;
  border:none;
  color:var(--green);
  font-size:14px;
  font-weight:700;
  margin-bottom:10px;
  cursor:pointer
}

.lbl{
  font-size:12px;
  color:var(--muted);
  margin:8px 0 4px
}

input,
select{
  width:100%;
  padding:10px;
  border-radius:10px;
  border:1px solid #cfd8d3;
  background:#fff;
  font-size:15px;
  color:var(--text)
}

.irow{
  display:flex;
  gap:8px;
  margin-bottom:8px
}

.irow input,
.irow select{
  flex:1
}

.res{
  margin-top:12px;
  background:#e2efe8;
  border-radius:12px;
  padding:12px;
  font-size:15px;
  color:var(--green);
  font-weight:700;
  text-align:center;
  min-height:20px
}

.res small{
  display:block;
  font-weight:500;
  color:var(--muted);
  margin-top:4px
}

.seg{
  display:flex;
  gap:6px;
  margin:8px 0
}

.seg button{
  flex:1;
  padding:10px;
  border-radius:12px;
  border:1px solid #cfd8d3;
  background:#fff;
  font-size:13px;
  color:var(--text);
  cursor:pointer
}

.seg button.on{
  background:var(--green);
  color:#fff;
  border-color:var(--green)
}

.disp{
  background:#fff;
  border-radius:14px;
  padding:14px;
  text-align:right;
  margin-bottom:10px;
  min-height:74px;
  display:flex;
  flex-direction:column;
  justify-content:flex-end
}

.disp small{
  color:var(--muted);
  font-size:13px;
  min-height:16px
}

.disp b{
  font-size:34px;
  font-weight:700;
  word-break:break-all
}

.keys{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px
}

.keys button{
  border:none;
  border-radius:14px;
  padding:16px 0;
  font-size:20px;
  background:#fff;
  color:var(--text);
  box-shadow:0 1px 2px rgba(0,0,0,.08);
  cursor:pointer
}

.keys button.op{
  background:#e2efe8;
  color:var(--green);
  font-weight:700
}

.keys button.eq{
  background:var(--yellow);
  font-weight:800
}

.keys button.cl{
  background:var(--green);
  color:#fff
}

.big{
  font-size:40px;
  font-weight:800;
  text-align:center;
  color:var(--green);
  margin:14px 0;
  font-variant-numeric:tabular-nums
}

.row{
  display:flex;
  gap:8px;
  justify-content:center
}

.row button{
  border:none;
  border-radius:12px;
  padding:12px 18px;
  font-size:15px;
  font-weight:600;
  background:var(--green);
  color:#fff;
  cursor:pointer
}

.row button.alt{
  background:#e2efe8;
  color:var(--green)
}

.note{
  font-size:11px;
  color:var(--muted);
  line-height:1.6;
  background:#f3efe2;
  border-radius:10px;
  padding:10px;
  margin-top:12px;
  font-weight:500
}
</style>
</head>

let expr='';

function calcDraw(){

const L=L0();

const keys=[
['C','cl'],['⌫','op'],['%','op'],['÷','op'],
['7',''],['8',''],['9',''],['×','op'],
['4',''],['5',''],['6',''],['−','op'],
['1',''],['2',''],['3',''],['+','op'],
['±','op'],['0',''],['.',''],['=','eq']
];

$('keys').innerHTML=
keys.map(k=>
'<button class="'+k[1]+'" data-k="'+k[0]+'">'+
k[0]+
'</button>'
).join('');

$('keys').querySelectorAll('button').forEach(b=>{
b.onclick=()=>calcKey(b.dataset.k);
});

$('expr').textContent=expr;
$('val').textContent=expr||'0';
}

function calcEval(e){

let s=e
.replace(/×/g,'*')
.replace(/÷/g,'/')
.replace(/−/g,'-');

try{
const r=Function('"use strict";return('+s+')')();
return isFinite(r)?r:null;
}
catch(err){
return null;
}
}

function calcKey(k){

if(k==='C'){expr='';}

else if(k==='⌫'){expr=expr.slice(0,-1);}

else if(k==='='){
const r=calcEval(expr);
expr=(r===null)?'':String(r);
}

else if(k==='±'){

if(expr&&expr[0]==='-')expr=expr.slice(1);
else if(expr)expr='-'+expr;

}

else{

if(k==='%')expr+='*0.01*'+
(expr.split(/[+−×÷]/).pop()||'');
else expr+=k;

}

$('expr').textContent=expr;
$('val').textContent=expr||'0';
}

/* =========================
   WARISAN (FARAID DASAR)
========================= */

function warisCalc(){

const el=$('wRes');
if(!el)return;

const L=L0();

const total=parseFloat($('wEstate').value)||0;
const debt=parseFloat($('wDebt').value)||0;
const willRaw=parseFloat($('wWill').value)||0;

const base=Math.max(0,total-debt);

/* wasiat dibatasi maksimal 1/3 */
const will=Math.min(Math.max(0,willRaw),base/3);

const N=base-will;

const son=Math.max(0,parseInt($('wSon').value)||0);
const dau=Math.max(0,parseInt($('wDau').value)||0);
const husb=(parseInt($('wHusb').value)||0)>0?1:0;
const wife=Math.min(4,Math.max(0,parseInt($('wWife').value)||0));
const fat=(parseInt($('wFat').value)||0)>0?1:0;
const mot=(parseInt($('wMot').value)||0)>0?1:0;

if(N<=0||(!son&&!dau&&!husb&&!wife&&!fat&&!mot)){
el.textContent=L.wFill;
return;
}

const kids=son+dau;
const out=[];
let used=0;

/* bagian suami / istri */
if(husb){
const s=kids?N/4:N/2;
out.push([L.wHusbS,s]);
used+=s;
}

if(wife){
const s=kids?N/8:N/4;
out.push([
L.wWifeS+(wife>1?' ('+wife+')':''),
s
]);
used+=s;
}

let rem=Math.max(0,N-used);

if(kids){

/* ayah & ibu masing-masing 1/6 jika ada anak */
if(fat){
out.push([L.wFatS,N/6]);
rem-=N/6;
}

if(mot){
out.push([L.wMotS,N/6]);
rem-=N/6;
}

rem=Math.max(0,rem);

/* sisa untuk anak, lk : pr = 2 : 1 */
const parts=son*2+dau;

if(son){
out.push([
L.wSonS+(son>1?' ('+son+')':''),
rem*son*2/parts
]);
}

if(dau){
out.push([
L.wDauS+(dau>1?' ('+dau+')':''),
rem*dau/parts
]);
}

}
else{

/* tidak ada anak */
if(mot){
/* ibu 1/3 dari sisa setelah bagian pasangan */
const s=rem/3;
out.push([L.wMotS,s]);
rem-=s;
}

if(fat){
/* ayah ashabah: mengambil seluruh sisa */
out.push([L.wFatS,rem]);
rem=0;
}

/* rad sederhana: sisa dikembalikan proporsional
   jika tidak ada ayah */
if(rem>0.005&&out.length){

const tot=out.reduce((a,o)=>a+o[1],0);

if(tot>0){
out.forEach(o=>{
o[1]+=rem*o[1]/tot;
});
}

}

}

let html=L.wNet+': '+fmt(N)+'<small>';

if(will>0){
html+=L.wWillS+': '+fmt(will)+'<br>';
}

html+=
out.map(o=>o[0]+': '+fmt(o[1]))
.join('<br>')+
'</small>';

el.innerHTML=html;
}

return p2(h)+':'+p2(m)+':'+p2(s)+'.'+p2(c);
}

'<small>'+L.amtF+': '+fmt(n*2.5*r)+'</small>';

}
}

function loanCalc(){

const el=$('lRes');
if(!el)return;

const L=L0();

const p=parseFloat($('lP').value);
const r=(parseFloat($('lApr').value)||0)/100/12;
const n=Math.max(1,parseInt($('lN').value)||1);

if(!isFinite(p)||p<=0){el.textContent='—';return;}

const m=r>0
?p*r/(1-Math.pow(1+r,-n))
:p/n;

el.innerHTML=
L.monthly+': '+fmt(m)+
'<small>'+
L.totInt+': '+fmt(m*n-p)+
'<br>'+L.totRes+': '+fmt(m*n)+
'</small>';
}

function interestCalc(){

const el=$('iRes');
if(!el)return;

const p=parseFloat($('iP').value);
const r=(parseFloat($('iApr').value)||0)/100;
const m=Math.max(1,parseInt($('iM').value)||1);

if(!isFinite(p)){el.textContent='—';return;}

el.innerHTML=fmt(p*Math.pow(1+r/12,m))+
'<small>'+
fmt(p*Math.pow(1+r,m))+
' (1 '+L.years.toLowerCase()+')'+
'</small>';
}

function saveCalc(){

const el=$('vRes');
if(!el)return;

const L=L0();

const s=parseFloat($('vS').value)||0;
const r=(parseFloat($('vApr').value)||0)/100/12;
const y=Math.max(1,parseInt($('vY').value)||1);
const n=y*12;

const fv=r>0
?s*((Math.pow(1+r,n)-1)/r)*(1+r)
:s*n;

el.innerHTML=
L.fv+': '+fmt(fv)+
'<small>'+
L.gain+': '+fmt(fv-s*n)+
'<br>'+L.totRes+': '+fmt(s*n)+
'</small>';
}

function taxCalc(){

const el=$('xRes');
if(!el)return;

const L=L0();

const r=parseFloat($('xRev').value)||0;

if(!r){el.textContent='—';return;}

el.innerHTML=
L.taxM+': '+fmt(r*0.005)+
'<small>'+L.taxY+': '+fmt(r*0.06)+'</small>';
}

function roiCalc(){

const el=$('rRes');
if(!el)return;

const L=L0();

const c=parseFloat($('rC').value);
const s=parseFloat($('rS').value);

if(!isFinite(c)||!isFinite(s)){
el.textContent='—';return;
}

const p=s-c;

el.innerHTML=
L.profit+': '+fmt(p)+
'<small>'+
L.margin+': '+
(s?fmt(p/s*100)+' %':'—')+
'<br>'+
L.roiL+': '+
(c?fmt(p/c*100)+' %':'—')+
'</small>';
}

function gcd(a,b){
return b?gcd(b,a%b):Math.abs(a);
}

function fpbCalc(){

const el=$('fRes');
if(!el)return;

const a=Math.abs(parseInt($('fA').value)||0);
const b=Math.abs(parseInt($('fB').value)||0);

if(!a||!b){el.textContent='—';return;}

el.innerHTML=
'FPB: '+fmt(gcd(a,b))+
'<small>KPK: '+fmt(a/gcd(a,b)*b)+'</small>';
}

function fracCalc(){

const el=$('frRes');
if(!el)return;

const L=L0();

let n=parseInt($('frN').value)||0;
let d=parseInt($('frD').value)||0;

if(!d){el.textContent='—';return;}

const g=gcd(n,d)||1;

el.innerHTML=
L.simp+': '+(n/g)+'/'+(d/g)+
'<small>'+L.dec+': '+fmt(n/d)+'</small>';
}

const ROMV=[
[1000,'M'],[900,'CM'],[500,'D'],[400,'CD'],
[100,'C'],[90,'XC'],[50,'L'],[40,'XL'],
[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']
];

function toRom(n){

let s='';

ROMV.forEach(v=>{
while(n>=v[0]){
s+=v[1];
n-=v[0];
}
});

return s;
}

function romCalc(){

const el=$('roRes');
if(!el)return;

const n=parseInt($('roN').value)||0;
const r=$('roR').value.trim().toUpperCase();

if(n>=1&&n<=3999){
el.textContent=toRom(n);
return;
}

if(r){

let tot=0,prev=0;

for(let i=r.length-1;i>=0;i--){

const v=ROMV.find(x=>x[1]===r[i]);

if(!v){el.textContent='—';return;}

const c=v[0];

tot+=(c<prev)?-c:c;
prev=c;
}

el.textContent=fmt(tot);
return;
}

el.textContent='—';
}

function geoBind(){

const upd=()=>{

$('geoR').hidden=geoMode!=='r';
$('geoC').hidden=geoMode!=='c';
$('geoT').hidden=geoMode!=='t';

$('gR').classList.toggle('on',geoMode==='r');
$('gC').classList.toggle('on',geoMode==='c');
$('gT').classList.toggle('on',geoMode==='t');

geoCalc();
};

$('gR').onclick=()=>{geoMode='r';upd();};
$('gC').onclick=()=>{geoMode='c';upd();};
$('gT').onclick=()=>{geoMode='t';upd();};

[
'gP','gL','gRr','gA','gTt',
'gS1','gS2','gS3'
].forEach(i=>{
if($(i))$(i).oninput=geoCalc;
});

upd();
}

function geoCalc(){

const el=$('gRes');
if(!el)return;

const L=L0();

let A=NaN,P=NaN;

if(geoMode==='r'){

const p=parseFloat($('gP').value);
const l=parseFloat($('gL').value);

A=p*l;
P=2*(p+l);

}
else if(geoMode==='c'){

const r=parseFloat($('gRr').value);

A=Math.PI*r*r;
P=2*Math.PI*r;

}
else{

const a=parseFloat($('gA').value);
const t=parseFloat($('gTt').value);

A=a*t/2;

const s=[
parseFloat($('gS1').value),
parseFloat($('gS2').value),
parseFloat($('gS3').value)
];

P=s.every(x=>isFinite(x))
?s[0]+s[1]+s[2]
:NaN;

}

if(!isFinite(A)){el.textContent='—';return;}

el.innerHTML=
L.area+': '+fmt(A)+
'<small>'+L.peri+': '+
(isFinite(P)?fmt(P):'—')+
'</small>';
}

'<input type="number" inputmode="numeric" min="1" class="ipkS" placeholder="'+L0().sks+'">';

d.querySelectorAll('input').forEach(i=>{
i.oninput=ipkCalc;
});

$('ipkRows').appendChild(d);

function ipkCalc(){

const el=$('ipkRes');
if(!el)return;

let tn=0,ts=0;

$('ipkRows').querySelectorAll('.irow').forEach(r=>{

const v=parseFloat(r.querySelector('.ipkV').value);
const s=parseFloat(r.querySelector('.ipkS').value)||0;

if(isFinite(v)){
tn+=v*s;
ts+=s;
}

});

el.innerHTML=ts?fmt(tn/ts):'—';
}

const UNITS={

uLen:{
m:1,km:1000,cm:0.01,mm:0.001,
mi:1609.34,yd:0.9144,ft:0.3048,in:0.0254
},

uWgt:{
kg:1,g:0.001,
ton:1000,ons:0.1,
lb:0.45359,oz:0.0283495
},

uTmp:{C:0,F:0,K:0},

uVal:{
IDR:1,USD:15600,EUR:17000,
GBP:19800,SGD:11600,MYR:3300,
JPY:105,SAR:4150,AED:4250
}
};

let uCatCur='uLen';

function unitBind(){

const L=L0();

$('uCat').innerHTML=
['uLen','uWgt','uTmp','uVal']
.map(c=>
'<option value="'+c+'">'+L[c]+'</option>'
).join('');

$('uCat').value=uCatCur;

$('uCat').onchange=()=>{
uCatCur=$('uCat').value;
unitFill();
};

['uVal','uFrom','uTo'].forEach(i=>{
$(i).oninput=unitCalc;
$(i).onchange=unitCalc;
});

unitFill();
}

function unitFill(){

const keys=Object.keys(UNITS[uCatCur]);

$('uFrom').innerHTML=
keys.map(k=>'<option>'+k+'</option>').join('');

$('uTo').innerHTML=
$('uFrom').innerHTML;

if(keys.length>1){
$('uTo').value=keys[1];
}

unitCalc();
}

function unitCalc(){

const el=$('uRes');
if(!el)return;

const v=parseFloat($('uVal').value);
const f=$('uFrom').value;
const t=$('uTo').value;

if(!isFinite(v)){el.textContent='—';return;}

let r;

if(uCatCur==='uTmp'){

let c;

if(f==='C')c=v;
else if(f==='F')c=(v-32)*5/9;
else c=v-273.15;

if(t==='C')r=c;
else if(t==='F')r=c*9/5+32;
else r=c+273.15;

}
else{

r=v*UNITS[uCatCur][f]/UNITS[uCatCur][t];

}

el.textContent=fmt(r)+' '+t;
}

function bbmCalc(){

const el=$('fRes');
if(!el)return;

const L=L0();

const d=parseFloat($('fDist').value);
const c=parseFloat($('fCons').value)||0;
const p=parseFloat($('fPrice').value)||0;

if(!isFinite(d)||!c){el.textContent='—';return;}

const l=d/c;

el.innerHTML=
L.fuelL+': '+fmt(l)+
'<small>'+L.fuelC+': '+fmt(l*p)+'</small>';
}

function catCalc(){

const el=$('cRes');
if(!el)return;

const L=L0();

const l=parseFloat($('cLen').value);
const h=parseFloat($('cHei').value)||0;
const c=Math.max(1,parseInt($('cCoats').value)||1);
const cv=parseFloat($('cCover').value)||0;

if(!isFinite(l)||!h||!cv){el.textContent='—';return;}

el.innerHTML=
L.paintL+': '+fmt(l*h*c/cv)+' L'+
'<small>'+L.area+': '+fmt(l*h)+' m²</small>';
}

function binCalc(){

const el=$('biRes');

const d=$('biDec');
const b=$('biBin');
const h=$('biHex');

if(!el)return;

const sync=(src,dec)=>{

if(!isFinite(dec)||dec<0||dec>4294967295){
el.textContent='—';
return;
}

if(src!==d)d.value=dec;
if(src!==b)b.value=dec.toString(2);
if(src!==h)h.value=dec.toString(16).toUpperCase();

el.textContent=dec;
};

d.oninput=()=>sync(d,parseInt(d.value)||NaN);

b.oninput=()=>
sync(b,parseInt(b.value.replace(/[^01]/g,''),2)||NaN);

h.oninput=()=>
sync(h,parseInt(h.value.replace(/[^0-9a-fA-F]/g,''),16)||NaN);

el.textContent='—';
}
