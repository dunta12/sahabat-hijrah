<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1e5b46">
<title>Kalkulator & Alat — Sahabat Hijrah</title>
<style>
:root{--green:#1e5b46;--yellow:#ffd200;--bg:#efece4;--card:#f8f8f6;--text:#21302b;--muted:#7d8a83}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);padding-bottom:24px}
header{position:sticky;top:0;z-index:5;background:var(--green);color:#fff;display:flex;align-items:center;gap:10px;padding:14px 16px}
header a{color:#fff;text-decoration:none;font-size:22px;line-height:1}
header h1{font-size:18px;flex:1}
header button{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:50%;width:38px;height:38px;font-size:17px}
.wrap{padding:14px 16px 0}
.card{background:var(--card);border-radius:18px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.lockbox{position:relative}
h3.cat{font-size:13px;color:var(--muted);margin:14px 2px 8px;font-weight:700}
h3.cat:first-child{margin-top:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tool{background:#fff;border-radius:14px;padding:14px;text-align:left;border:none;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.tool .ic{font-size:26px;display:block;margin-bottom:6px}
.tool b{font-size:14px;color:var(--text)}
.back{background:none;border:none;color:var(--green);font-size:14px;font-weight:700;margin-bottom:10px}
.lbl{font-size:12px;color:var(--muted);margin:8px 0 4px}
input{width:100%;padding:10px;border-radius:10px;border:1px solid #cfd8d3;background:#fff;font-size:15px;color:var(--text)}
.res{margin-top:12px;background:#e2efe8;border-radius:12px;padding:12px;font-size:15px;color:var(--green);font-weight:700;text-align:center;min-height:20px}
.res small{display:block;font-weight:500;color:var(--muted);margin-top:4px}
.seg{display:flex;gap:6px;margin:8px 0}
.seg button{flex:1;padding:10px;border-radius:12px;border:1px solid #cfd8d3;background:#fff;font-size:13px;color:var(--text)}
.seg button.on{background:var(--green);color:#fff;border-color:var(--green)}
.disp{background:#fff;border-radius:14px;padding:14px;text-align:right;margin-bottom:10px;min-height:74px;display:flex;flex-direction:column;justify-content:flex-end}
.disp small{color:var(--muted);font-size:13px;min-height:16px}
.disp b{font-size:34px;font-weight:700;word-break:break-all}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.keys button{border:none;border-radius:14px;padding:16px 0;font-size:20px;background:#fff;color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.keys button.op{background:#e2efe8;color:var(--green);font-weight:700}
.keys button.eq{background:var(--yellow);font-weight:800}
.keys button.cl{background:var(--green);color:#fff}
.big{font-size:40px;font-weight:800;text-align:center;color:var(--green);margin:14px 0;font-variant-numeric:tabular-nums}
.row{display:flex;gap:8px;justify-content:center}
.row button{border:none;border-radius:12px;padding:12px 18px;font-size:15px;font-weight:600;background:var(--green);color:#fff}
.row button.alt{background:#e2efe8;color:var(--green)}
.tin{display:flex;gap:8px;justify-content:center;margin-bottom:10px}
.tin input{width:70px;text-align:center}
.badge{margin-top:12px;text-align:center;font-size:12px;color:var(--green);background:#e2efe8;border-radius:10px;padding:6px}
.lock{position:absolute;inset:0;z-index:2;background:rgba(239,236,228,.78);backdrop-filter:blur(6px);border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px}
.lock h3{font-size:18px}
.lock p{font-size:13px;color:var(--muted);max-width:260px}
.lock button{background:var(--yellow);border:none;border-radius:14px;padding:13px 18px;font-size:15px;font-weight:700;color:#21302b}
.modal{position:fixed;inset:0;z-index:9;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;padding:20px}
.modal.show{display:flex}
.modal .box{background:#fff;border-radius:20px;padding:26px;text-align:center;max-width:320px;width:100%}
.modal .num{font-size:52px;font-weight:800;color:var(--green);margin:10px 0}
.modal p{font-size:13px;color:var(--muted)}
</style>

pplF:'Number of people',rice:'Rice price / kg',kgF:'Total rice (2.5 kg / person)',amtF:'Estimated if paid in money',
start:'Start',pause:'Pause',reset:'Reset',done:'⏰ Time\'s up!'}
};
const p2=n=>String(n).padStart(2,'0');
const fmt=n=>isFinite(n)?n.toLocaleString(lang==='id'?'id-ID':'en-US',{maximumFractionDigits:2}):'Error';
function unlocked(){return Date.now()<(+localStorage.getItem(KEY)||0)}
function refreshLock(){const L=T[lang];
 if(unlocked()){$('lock').style.display='none';const h=Math.max(1,Math.round((+localStorage.getItem(KEY)-Date.now())/36e5));$('badge').hidden=false;$('badge').textContent=L.badge.replace('%h%',h)}
 else{$('lock').style.display='flex';$('badge').hidden=true}}
function startRewardedAd(done){$('adTitle').textContent=T[lang].adT;$('adNote').textContent=T[lang].adN;$('modal').classList.add('show');let c=5;$('count').textContent=c;
 const iv=setInterval(()=>{c--;if(c<=0){clearInterval(iv);$('count').textContent='✅';$('adNote').textContent=T[lang].thanks;setTimeout(()=>{$('modal').classList.remove('show');done()},1200)}else $('count').textContent=c},1000)}
/* ---- menu ---- */
function menuHTML(){const L=T[lang];
const c=(id,ic,nm)=>'<button class="tool" data-tool="'+id+'"><span class="ic">'+ic+'</span><b>'+nm+'</b></button>';
return '<h3 class="cat">'+L.catM+'</h3><div class="grid2">'+c('calc','🧮',L.calc)+c('pct','📊',L.pct)+'</div>'
+'<h3 class="cat">'+L.catF+'</h3><div class="grid2">'+c('disc','🏷️',L.disc)+c('tip','🍽️',L.tip)+c('split','👥',L.split)+c('zakat','🕌',L.zakat)+'</div>'
+'<h3 class="cat">'+L.catT+'</h3><div class="grid2">'+c('age','📅',L.age)+c('diff','🗓️',L.diff)+c('sw','⏱️',L.sw)+c('tm','⏳',L.tm)+'</div>'
+'<h3 class="cat">'+L.catH+'</h3><div class="grid2">'+c('bmi','❤️',L.bmi)+'</div>'}
/* ---- isi alat ---- */
function toolHTML(id){const L=T[lang];
if(id==='calc')return '<button class="back" data-back>'+L.back+'</button><div class="disp"><small id="expr"></small><b id="val">0</b></div><div class="keys" id="keys"></div>';
if(id==='pct')return '<button class="back" data-back>'+L.back+'</button><div class="seg"><button id="pm1" class="on">'+L.m1+'</button><button id="pm2">'+L.m2+'</button></div><div class="lbl">X</div><input type="number" inputmode="decimal" id="px"><div class="lbl">Y</div><input type="number" inputmode="decimal" id="py"><div class="res" id="pr">—</div>';
if(id==='disc')return '<button class="back" data-back>'+L.back+'</button><div class="lbl">'+L.price+'</div><input type="number" inputmode="decimal" id="dPrice"><div class="lbl">'+L.dPct+'</div><input type="number" inputmode="decimal" id="dPct"><div class="res" id="dRes">—</div>';
if(id==='tip')return '<button class="back" data-back>'+L.back+'</button><div class="lbl">'+L.bill+'</div><input type="number" inputmode="decimal" id="tBill"><div class="lbl">'+L.tipPct+'</div><input type="number" inputmode="decimal" id="tPct" value="10"><div class="lbl">'+L.ppl+'</div><input type="number" inputmode="numeric" id="tPpl" value="1"><div class="res" id="tRes">—</div>';
if(id==='split')return '<button class="back" data-back>'+L.back+'</button><div class="lbl">'+L.bill+'</div><input type="number" inputmode="decimal" id="sTotal"><div class="lbl">'+L.ppl+'</div><input type="number" inputmode="numeric" id="sPpl" value="2"><div class="res" id="sRes">—</div>';
if(id==='bmi')return '<button class="back" data-back>'+L.back+'</button><div class="lbl">'+L.w+'</div><input type="number" inputmode="decimal" id="bW"><div class="lbl">'+L.h+'</div><input type="number" inputmode="decimal" id="bH"><div class="res" id="bRes">—</div>';
if(id==='age')return '<button class="back" data-back>'+L.back+'</button><div class="lbl">'+L.dob+'</div><input type="date" id="dob"><div class="res" id="ageRes">—</div>';
if(id==='diff')return '<button class="back" data-back>'+L.back+'</button><div class="lbl">'+L.d1+'</div><input type="date" id="dd1"><div class="lbl">'+L.d2+'</div><input type="date" id="dd2"><div class="res" id="diffRes">—</div>';
if(id==='sw')return '<button class="back" data-back>'+L.back+'</button><div class="big" id="swDisp">00:00:00.00</div><div class="row"><button id="swGo"></button><button id="swRe" class="alt"></button></div>';
if(id==='tm')return '<button class="back" data-back>'+L.back+'</button><div class="tin"><input type="number" id="tmM" min="0" max="99" value="5"><input type="number" id="tmS" min="0" max="59" value="0"></div><div class="big" id="tmDisp">05:00</div><div class="row"><button id="tmGo"></button><button id="tmRe" class="alt"></button></div>';
if(id==='zakat')return '<button class="back" data-back>'+L.back+'</button><div class="seg"><button id="zm" class="on">'+L.mal+'</button><button id="zf">'+L.fit+'</button></div><div id="malBox"><div class="lbl">'+L.gold+'</div><input type="number" inputmode="decimal" id="zGold" value="1500000"><div class="lbl">'+L.assets+'</div><input type="number" inputmode="decimal" id="zAssets"></div><div id="fitBox" hidden><div class="lbl">'+L.pplF+'</div><input type="number" inputmode="numeric" id="zPpl" value="1"><div class="lbl">'+L.rice+'</div><input type="number" inputmode="decimal" id="zRice" value="15000"></div><div class="res" id="zRes">—</div>';
return ''}
/* ---- kalkulator ---- */
let a=null,op=null,cur='0',fresh=false;
const rd=v=>+Number(v).toPrecision(12);
function apply(x,o,y){return rd(o==='+'?x+y:o==='−'?x-y:o==='×'?x*y:y===0?NaN:x/y)}
function setNum(r){cur=isFinite(r)?String(r):'Error'}
function disp(){const e=$('expr'),v=$('val');if(!e)return;e.textContent=(a!==null&&op)?(a+' '+op):'';v.textContent=cur}
function calc(b){
 if(b>='0'&&b<='9'){cur=(cur==='0'||cur==='Error'||fresh)?b:cur+b;fresh=false}
 else if(b==='.'){if(fresh||cur==='Error'){cur='0.';fresh=false}else if(!cur.includes('.'))cur+='.'}
 else if(b==='C'){cur='0';a=null;op=null;fresh=false}
 else if(b==='⌫'){cur=(cur.length>1&&cur!=='Error')?cur.slice(0,-1):'0'}
 else if(b==='±'){if(cur!=='0'&&cur!=='Error')cur=cur.startsWith('-')?cur.slice(1):'-'+cur}
 else if(b==='%'){setNum(rd(parseFloat(cur)/100));fresh=true}
 else if('÷×−+'.includes(b)){if(cur==='Error')cur='0';const v=parseFloat(cur);
  if(a!==null&&op&&!fresh)setNum(apply(a,op,v));else setNum(v);
  if(cur!=='Error')a=parseFloat(cur);op=b;fresh=true}
 else if(b==='='){if(op!==null&&a!==null){setNum(apply(a,op,parseFloat(cur)));a=null;op=null;fresh=true}}
 disp()}
const KEYS=['C','±','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','⌫','0','.','='];
/* ---- alat lain ---- */
function pctCalc(){const el=$('pr');if(!el)return;const x=parseFloat($('px').value)||0,y=parseFloat($('py').value)||0;
 el.textContent=pctMode===1?fmt(x/100*y):fmt(y?x/y*100:NaN)+'%'}
function discCalc(){const el=$('dRes');if(!el)return;const p=parseFloat($('dPrice').value)||0,d=parseFloat($('dPct').value)||0;
 el.innerHTML=L0().final+': '+fmt(p*(1-d/100))+'<small>'+L0().save+': '+fmt(p*d/100)+'</small>'}
function tipCalc(){const el=$('tRes');if(!el)return;const L=L0(),b=parseFloat($('tBill').value)||0,t=parseFloat($('tPct').value)||0,n=Math.max(1,parseFloat($('tPpl').value)||1);
 const tip=b*t/100;el.innerHTML=L.tipRes+': '+fmt(tip)+' · '+L.totRes+': '+fmt(b+tip)+'<small>'+L.perRes+': '+fmt((b+tip)/n)+'</small>'}
function splitCalc(){const el=$('sRes');if(!el)return;const t=parseFloat($('sTotal').value)||0,n=Math.max(1,parseFloat($('sPpl').value)||1);
 el.innerHTML=L0().perRes+': '+fmt(t/n)}
function bmiCalc(){const el=$('bRes');if(!el)return;const w=parseFloat($('bW').value)||0,h=parseFloat($('bH').value)||0;
 if(!w||!h){el.textContent='—';return}const b=w/Math.pow(h/100,2);
 el.innerHTML=fmt(b)+' — '+L0().bmiCat[b<18.5?0:b<25?1:b<30?2:3]}
function ageCalc(){const el=$('ageRes');if(!el)return;const L=L0(),v=$('dob').value;
 if(!v){el.textContent='—';return}
 const b=new Date(v+'T12:00:00'),n=new Date();
 let y=n.getFullYear()-b.getFullYear(),m=n.getMonth()-b.getMonth(),d=n.getDate()-b.getDate();
 if(d<0){m--;d+=new Date(n.getFullYear(),n.getMonth(),0).getDate()}
 if(m<0){y--;m+=12}
 let nb=new Date(n.getFullYear(),b.getMonth(),b.getDate(),12);if(nb<=n)nb=new Date(n.getFullYear()+1,b.getMonth(),b.getDate(),12);
 el.innerHTML=y+' '+L.yL+' '+m+' '+L.mL+' '+d+' '+L.dL+'<small>'+L.totD+': '+fmt(Math.floor((n-b)/864e5))+' · '+L.nb+': '+fmt(Math.ceil((nb-n)/864e5))+' '+L.dL+'</small>'}
function diffCalc(){const el=$('diffRes');if(!el)return;const L=L0(),x=$('dd1').value,y=$('dd2').value;
 if(!x||!y){el.textContent='—';return}
 const d=Math.round(Math.abs(new Date(y)-new Date(x))/864e5);
 el.innerHTML=fmt(d)+' '+L.dL+'<small>≈ '+fmt(d/7)+' '+L.wk+' · ≈ '+fmt(d/30.44)+' '+L.mo+'</small>'}
function zakatCalc(){const el=$('zRes');if(!el)return;const L=L0();
 if(zakMode==='mal'){const g=parseFloat($('zGold').value)||0,as=parseFloat($('zAssets').value)||0,nis=g*85;
  if(nis>0&&as>=nis)el.innerHTML=L.due+'<small>'+L.nisab+': '+fmt(nis)+' · '+L.zRes+': '+fmt(as*0.025)+'</small>';
  else el.innerHTML=L.notDue+'<small>'+L.nisab+': '+fmt(nis)+'</small>'}
 else{const n=Math.max(0,parseFloat($('zPpl').value)||0),r=parseFloat($('zRice').value)||0;
  el.innerHTML=L.kgF+': '+fmt(2.5*n)+' kg<small>'+L.amtF+': '+fmt(2.5*n*r)+'</small>'}}
/* ---- stopwatch & timer ---- */
let swRun=false,swAcc=0,swT0=0,swIv=null,tmRun=false,tmIv=null;
function swShow(ms){const el=$('swDisp');if(!el)return;const s=Math.floor(ms/1000);
 el.textContent=p2(Math.floor(s/3600))+':'+p2(Math.floor(s/60)%60)+':'+p2(s%60)+'.'+p2(Math.floor(ms%1000/10))}
function swToggle(){const L=L0();
 if(swRun){swAcc+=Date.now()-swT0;clearInterval(swIv);swRun=false;
const b=$('swGo');if(b)b.textContent=L.start}
 else{swT0=Date.now();swRun=true;const b=$('swGo');if(b)b.textContent=L.pause;swIv=setInterval(()=>swShow(swAcc+Date.now()-swT0),50)}}
function swReset(){clearInterval(swIv);swRun=false;swAcc=0;swShow(0);const b=$('swGo');if(b)b.textContent=L0().start}
function beep(){try{const C=new (window.AudioContext||window.webkitAudioContext)();for(let i=0;i<3;i++){const o=C.createOscillator(),g=C.createGain();o.connect(g);g.connect(C.destination);o.frequency.value=880;const t=C.currentTime+i*0.45;g.gain.setValueAtTime(0.001,t);g.gain.exponentialRampToValueAtTime(0.4,t+0.02);g.gain.exponentialRampToValueAtTime(0.001,t+0.35);o.start(t);o.stop(t+0.4)}}catch(e){}}
function tmShow(ms){const el=$('tmDisp');if(!el)return;const s=Math.max(0,Math.ceil(ms/1000));el.textContent=p2(Math.floor(s/60))+':'+p2(s%60)}
function tmInput(){tmShow(((+$('tmM').value)||0)*60+((+$('tmS').value)||0))*1000}
function tmToggle(){const L=L0();
 if(tmRun){clearInterval(tmIv);tmRun=false;const b=$('tmGo');if(b)b.textContent=L.start;return}
 const tot=((+$('tmM').value)||0)*60+((+$('tmS').value)||0);if(tot<=0)return;
 const end=Date.now()+tot*1000;tmRun=true;const b=$('tmGo');if(b)b.textContent=L.pause;
 tmIv=setInterval(()=>{const left=end-Date.now();
  if(left<=0){clearInterval(tmIv);tmRun=false;tmShow(0);const e=$('tmDisp');if(e)e.textContent=L.done;beep();const g=$('tmGo');if(g)g.textContent=L.start}
  else tmShow(left)},200)}
function tmReset(){clearInterval(tmIv);tmRun=false;const b=$('tmGo');if(b)b.textContent=L0().start;tmInput()}
function L0(){return T[lang]}
/* ---- bind & render ---- */
function bindTool(id){const L=L0();
if(id==='calc'){$('keys').innerHTML=KEYS.map(k=>{let c='';if('÷×−+'.includes(k))c='op';if(k==='=')c='eq';if(k==='C'||k==='⌫')c='cl';return '<button data-k="'+k+'" class="'+c+'">'+k+'</button>'}).join('');
 $('keys').onclick=e=>{const k=e.target.dataset?e.target.dataset.k:null;if(k)calc(k)};disp()}
else if(id==='pct'){$('pm1').onclick=()=>{pctMode=1;$('pm1').classList.add('on');$('pm2').classList.remove('on');pctCalc()};
 $('pm2').onclick=()=>{pctMode=2;$('pm2').classList.add('on');$('pm1').classList.remove('on');pctCalc()};
 $('px').oninput=pctCalc;$('py').oninput=pctCalc;pctCalc()}
else if(id==='disc'){$('dPrice').oninput=discCalc;$('dPct').oninput=discCalc;discCalc()}
else if(id==='tip'){$('tBill').oninput=tipCalc;$('tPct').oninput=tipCalc;$('tPpl').oninput=tipCalc;tipCalc()}
else if(id==='split'){$('sTotal').oninput=splitCalc;$('sPpl').oninput=splitCalc;splitCalc()}
else if(id==='bmi'){$('bW').oninput=bmiCalc;$('bH').oninput=bmiCalc;bmiCalc()}
else if(id==='age'){$('dob').onchange=ageCalc;ageCalc()}
else if(id==='diff'){$('dd1').onchange=diffCalc;$('dd2').onchange=diffCalc;diffCalc()}
else if(id==='sw'){$('swGo').textContent=swRun?L.pause:L.start;$('swRe').textContent=L.reset;swShow(swAcc);$('swGo').onclick=swToggle;$('swRe').onclick=swReset}
else if(id==='tm'){$('tmGo').textContent=tmRun?L.pause:L.start;$('tmRe').textContent=L.reset;tmInput();
 $('tmM').oninput=()=>{if(!tmRun)tmInput()};$('tmS').oninput=()=>{if(!tmRun)tmInput()};
 $('tmGo').onclick=tmToggle;$('tmRe').onclick=tmReset}
else if(id==='zakat'){$('zm').onclick=()=>{zakMode='mal';$('zm').classList.add('on');$('zf').classList.remove('on');$('malBox').hidden=false;$('fitBox').hidden=true;zakatCalc()};
 $('zf').onclick=()=>{zakMode='fit';$('zf').classList.add('on');$('zm').classList.remove('on');$('fitBox').hidden=false;$('malBox').hidden=true;zakatCalc()};
 ['zGold','zAssets','zPpl','zRice'].forEach(i=>{const el=$(i);if(el)el.oninput=zakatCalc});zakatCalc()}}
function render(){const L=L0();
 $('t').textContent=L.t;document.title=L.t+' — Sahabat Hijrah';
 $('lk1').textContent=L.lk1;$('lk2').textContent=L.lk2;$('lk3').textContent=L.lk3;
 $('content').innerHTML=view==='menu'?menuHTML():toolHTML(view);
 if(view==='menu')$('content').querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{view=b.dataset.tool;render()});
 else{const bk=$('content').querySelector('[data-back]');if(bk)bk.onclick=()=>{view='menu';render()};bindTool(view)}
 refreshLock()}
$('lang').onclick=()=>{lang=lang==='id'?'en':'id';localStorage.setItem(LKEY,lang);render()};
$('unlock').onclick=()=>startRewardedAd(()=>{localStorage.setItem(KEY,Date.now()+24*36e5);refreshLock()});
render();
</script>
</body>
</html>
