<style>
:root{--green:#1e5b46;--yellow:#ffd200;--bg:#efece4;--card:#f8f8f6;--text:#21302b;--muted:#7d8a83}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);padding-bottom:24px}
header{position:sticky;top:0;z-index:5;background:var(--green);color:#fff;display:flex;align-items:center;gap:10px;padding:14px 16px}
header a{color:#fff;text-decoration:none;font-size:22px;line-height:1}
header h1{font-size:18px;flex:1}
header button{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:50%;width:38px;height:38px;font-size:17px}
.wrap{padding:14px 16px 0}
.card{background:var(--card);border-radius:18px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.lockbox{position:relative}
h3.cat{font-size:13px;color:var(--muted);margin:14px 2px 8px;font-weight:700}
h3.cat:first-child{margin-top:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tool{background:#fff;border-radius:14px;padding:14px;text-align:left;border:none;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.tool .ic{font-size:26px;display:block;margin-bottom:6px}
.tool b{font-size:14px;color:var(--text)}
.back{background:none;border:none;color:var(--green);font-size:14px;font-weight:700;margin-bottom:10px}
.lbl{font-size:12px;color:var(--muted);margin:8px 0 4px}
input,select{width:100%;padding:10px;border-radius:10px;border:1px solid #cfd8d3;background:#fff;font-size:15px;color:var(--text)}
.irow{display:flex;gap:8px;margin-bottom:8px}
.irow input{flex:1}
.irow select{flex:1}
.res{margin-top:12px;background:#e2efe8;border-radius:12px;padding:12px;font-size:15px;color:var(--green);font-weight:700;text-align:center;min-height:20px}
.res small{display:block;font-weight:500;color:var(--muted);margin-top:4px}
.seg{display:flex;gap:6px;margin:8px 0}
.seg button{flex:1;padding:10px;border-radius:12px;border:1px solid #cfd8d3;background:#fff;font-size:13px;color:var(--text)}
.seg button.on{background:var(--green);color:#fff;border-color:var(--green)}
.disp{background:#fff;border-radius:14px;padding:14px;text-align:right;margin-bottom:10px;min-height:74px;display:flex;flex-direction:column;justify-content:flex-end}
.disp small{color:var(--muted);font-size:13px;min-height:16px}
.disp b{font-size:34px;font-weight:700;word-break:break-all}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.keys button{border:none;border-radius:14px;padding:16px 0;font-size:20px;background:#fff;color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.keys button.op{background:#e2efe8;color:var(--green);font-weight:700}
.keys button.eq{background:var(--yellow);font-weight:800}
.keys button.cl{background:var(--green);color:#fff}
.big{font-size:40px;font-weight:800;text-align:center;color:var(--green);margin:14px 0;font-variant-numeric:tabular-nums}
.row{display:flex;gap:8px;justify-content:center}
.row button{border:none;border-radius:12px;padding:12px 18px;font-size:15px;font-weight:600;background:var(--green);color:#fff}
.row button.alt{background:#e2efe8;color:var(--green)}
.tin{display:flex;gap:8px;justify-content:center;margin-bottom:10px}
.tin input{width:70px;text-align:center}
.badge{margin-top:12px;text-align:center;font-size:12px;color:var(--green);background:#e2efe8;border-radius:10px;padding:6px}
.lock{position:absolute;inset:0;z-index:2;background:rgba(239,236,228,.78);backdrop-filter:blur(6px);border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px}
.lock h3{font-size:18px}
.lock p{font-size:13px;color:var(--muted);max-width:260px}
.lock button{background:var(--yellow);border:none;border-radius:14px;padding:13px 18px;font-size:15px;font-weight:700;color:#21302b}
.modal{position:fixed;inset:0;z-index:9;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;padding:20px}
.modal.show{display:flex}
.modal .box{background:#fff;border-radius:20px;padding:26px;text-align:center;max-width:320px;width:100%}
.modal .num{font-size:52px;font-weight:800;color:var(--green);margin:10px 0}
.modal p{font-size:13px;color:var(--muted)}
</style>

function loadCPAGrip(callback) {
    if (window.cpagripDoneCallback && typeof call_locker === 'function') {
        callback();
        return;
    }
    
    const script = document.createElement('script');
    script.type = 'text/javascript';
    script.src = 'https://optilinklock.com/script_include.php?id=1911732';
    script.onload = () => {
        // Simpan callback untuk dipakai nanti oleh fungsi optiLinkLockSuccess
        window.cpagripDoneCallback = callback;
    };
    script.onerror = () => {
        alert('Gagal memuat sistem verifikasi. Silakan coba lagi.');
    };
    document.head.appendChild(script);
}

if(id==='geo')return b0+'<div class=\"seg\"><button id=\"gR\" class=\"on\">'+L.shapeR+'</button><button id=\"gC\">'+L.shapeC+'</button><button id=\"gT\">'+L.shapeT+'</button></div><div id=\"geoR\"><div class=\"lbl\">'+L.len+'</div><input type=\"number\" inputmode=\"decimal\" id=\"gP\"><div class=\"lbl\">'+L.wid+'</div><input type=\"number\" inputmode=\"decimal\" id=\"gL\"></div><div id=\"geoC\" hidden><div class=\"lbl\">'+L.rad+'</div><input type=\"number\" inputmode=\"decimal\" id=\"gRr\"></div><div id=\"geoT\" hidden><div class=\"lbl\">'+L.base+'</div><input type=\"number\" inputmode=\"decimal\" id=\"gA\"><div class=\"lbl\">'+L.hei+'</div><input type=\"number\" inputmode=\"decimal\" id=\"gH\"><div class=\"lbl\">'+L.s1+'</div><input type=\"number\" inputmode=\"decimal\" id=\"gS1\"><div class=\"lbl\">'+L.s2+'</div><input type=\"number\" inputmode=\"decimal\" id=\"gS2\"><div class=\"lbl\">'+L.s3+'</div><input type=\"number\" inputmode=\"decimal\" id=\"gS3\"></div><div class=\"res\" id=\"gRes\">—</div>';
if(id==='ipk'){let rows='';for(let i=0;i<6;i++){rows+='<div class=\"irow\"><input type=\"number\" inputmode=\"numeric\" id=\"ip'+i+'s\" placeholder=\"'+L.sks+'\"><select id=\"ip'+i+'g\"><option value=\"4\">A</option><option value=\"3.5\">A-</option><option value=\"3\">B+</option><option value=\"2.5\">B</option><option value=\"2\">C</option><option value=\"1\">D</option><option value=\"0\">E</option></select></div>'}
return b0+rows+'<div class=\"res\" id=\"ipRes\">—</div>'}
if(id==='unit')return b0+'<div class=\"lbl\">'+L.uCat+'</div><select id=\"uCat\"><option value=\"len\">'+L.uLen+'</option><option value=\"wgt\">'+L.uWgt+'</option><option value=\"tmp\">'+L.uTmp+'</option></select><div class=\"lbl\">'+L.uVal+'</div><input type=\"number\" inputmode=\"decimal\" id=\"uV\" value=\"1\"><div class=\"irow\"><select id=\"uF\"></select><select id=\"uT\"></select></div><div class=\"res\" id=\"uRes\">—</div>';
if(id==='bbm')return b0+'<div class=\"lbl\">'+L.dist+'</div><input type=\"number\" inputmode=\"decimal\" id=\"bbD\"><div class=\"lbl\">'+L.cons+'</div><input type=\"number\" inputmode=\"decimal\" id=\"bbC\" value=\"15\"><div class=\"lbl\">'+L.fuelP+'</div><input type=\"number\" inputmode=\"decimal\" id=\"bbP\" value=\"10000\"><div class=\"res\" id=\"bbRes\">—</div>';
if(id==='cat2')return b0+'<div class=\"lbl\">'+L.wallP+'</div><input type=\"number\" inputmode=\"decimal\" id=\"cpP\"><div class=\"lbl\">'+L.wallH+'</div><input type=\"number\" inputmode=\"decimal\" id=\"cpH\"><div class=\"lbl\">'+L.coats+'</div><input type=\"number\" inputmode=\"numeric\" id=\"cpC\" value=\"2\"><div class=\"lbl\">'+L.cover+'</div><input type=\"number\" inputmode=\"decimal\" id=\"cpCov\" value=\"10\"><div class=\"res\" id=\"cpRes\">—</div>';
if(id==='bin')return b0+'<div class=\"lbl\">'+L.decN+'</div><input type=\"number\" inputmode=\"numeric\" id=\"bnD\"><div class=\"lbl\">'+L.binN+'</div><input type=\"text\" id=\"bnB\"><div class=\"lbl\">'+L.hexN+'</div><input type=\"text\" id=\"bnH\"><div class=\"res\" id=\"bnRes\">—</div>';
return ''}

// ... [SELURUH FUNGSI PERHITUNGAN (calc, pctCalc, discCalc, dll) TETAP SAMA] ...

// ==== BAGIAN UTAMA & NAVIGASI ====
function L0(){return T[lang]}
function renderMenu(){$('t').textContent=T[lang].t;$('content').innerHTML=menuHTML();refreshLock()}
function renderTool(id){$('t').textContent=T[lang][id]||id;$('content').innerHTML=toolHTML(id);view=id;attachEvents();refreshLock()}

function attachEvents(){
 // Tombol kembali
 document.querySelectorAll('[data-back]').forEach(b=>b.onclick=renderMenu);
 // Tombol menu alat
 document.querySelectorAll('[data-tool]').forEach(b=>{
    b.onclick = () => {
        const toolId = b.dataset.tool;
        // Cek apakah alat ini termasuk dalam daftar premium
        if (PREMIUM_TOOLS.includes(toolId) && !unlocked()) {
            // Jika belum unlock dan alatnya premium -> tampilkan locker
            loadCPAGrip(() => {
                if (typeof call_locker === 'function') {
                    call_locker();
                }
            });
            return; // Hentikan eksekusi, jangan buka alatnya
        }
        // Jika gratis atau sudah unlock -> buka alat seperti biasa
        renderTool(toolId);
    };
 });
 
 // ... [ATTACH EVENT UNTUK SETIAP ALAT TETAP SAMA] ...
}

// Ganti Bahasa
$('lang').onclick=()=>{lang=lang==='id'?'en':'id';localStorage.setItem(LKEY,lang);renderMenu()};

// Jalankan pertama kali
renderMenu();
</script>
