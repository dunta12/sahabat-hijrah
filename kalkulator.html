<style>
:root{--green:#1e5b46;--yellow:#ffd200;--bg:#efece4;--card:#f8f8f6;--text:#21302b;--muted:#7d8a83}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);padding-bottom:24px}
header{position:sticky;top:0;z-index:5;background:var(--green);color:#fff;display:flex;align-items:center;gap:10px;padding:14px 16px}
header a{color:#fff;text-decoration:none;font-size:22px;line-height:1}
header h1{font-size:18px;flex:1}
header button{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:50%;width:38px;height:38px;font-size:17px}
.wrap{padding:14px 16px 0}
.card{background:var(--card);border-radius:18px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
h3.cat{font-size:13px;color:var(--muted);margin:14px 2px 8px;font-weight:700}
h3.cat:first-child{margin-top:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tool{background:#fff;border-radius:14px;padding:14px;text-align:left;border:none;box-shadow:0 1px 2px rgba(0,0,0,.06);width:100%}
.tool .ic{font-size:26px;display:block;margin-bottom:6px}
.tool b{font-size:14px;color:var(--text)}
.back{background:none;border:none;color:var(--green);font-size:14px;font-weight:700;margin-bottom:10px;cursor:pointer}
.lbl{font-size:12px;color:var(--muted);margin:8px 0 4px}
input,select{width:100%;padding:10px;border-radius:10px;border:1px solid #cfd8d3;background:#fff;font-size:15px;color:var(--text)}
.irow{display:flex;gap:8px;margin-bottom:8px}
.irow input,.irow select{flex:1}
.res{margin-top:12px;background:#e2efe8;border-radius:12px;padding:12px;font-size:15px;color:var(--green);font-weight:700;text-align:center;min-height:20px}
.res small{display:block;font-weight:500;color:var(--muted);margin-top:4px}
.seg{display:flex;gap:6px;margin:8px 0}
.seg button{flex:1;padding:10px;border-radius:12px;border:1px solid #cfd8d3;background:#fff;font-size:13px;color:var(--text);cursor:pointer}
.seg button.on{background:var(--green);color:#fff;border-color:var(--green)}
.disp{background:#fff;border-radius:14px;padding:14px;text-align:right;margin-bottom:10px;min-height:74px;display:flex;flex-direction:column;justify-content:flex-end}
.disp small{color:var(--muted);font-size:13px;min-height:16px}
.disp b{font-size:34px;font-weight:700;word-break:break-all}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.keys button{border:none;border-radius:14px;padding:16px 0;font-size:20px;background:#fff;color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08);cursor:pointer}
.keys button.op{background:#e2efe8;color:var(--green);font-weight:700}
.keys button.eq{background:var(--yellow);font-weight:800}
.keys button.cl{background:var(--green);color:#fff}
.big{font-size:40px;font-weight:800;text-align:center;color:var(--green);margin:14px 0;font-variant-numeric:tabular-nums}
.row{display:flex;gap:8px;justify-content:center}
.row button{border:none;border-radius:12px;padding:12px 18px;font-size:15px;font-weight:600;background:var(--green);color:#fff;cursor:pointer}
.row button.alt{background:#e2efe8;color:var(--green)}
.tin{display:flex;gap:8px;justify-content:center;margin-bottom:10px}
.tin input{width:70px;text-align:center}
</style>
</head>

// LOGIKA KALKULATOR
let a = null, op = null, cur = '0', fresh = false;
const rd = v => +Number(v).toPrecision(12);
function apply(x, o, y) { return rd(o === '+' ? x + y : o === '−' ? x - y : o === '×' ? x * y : y === 0 ? NaN : x / y) }
function setNum(r) { cur = isFinite(r) ? String(r) : 'Error' }
function disp() { const e = $('expr'), v = $('val'); if (!e) return; e.textContent = (a !== null && op) ? (a + ' ' + op) : ''; v.textContent = cur }
function calc(b) {
    if (b >= '0' && b <= '9') { cur = (cur === '0' || cur === 'Error' || fresh) ? b : cur + b; fresh = false }
    else if (b === '.') { if (fresh || cur === 'Error') { cur = '0.'; fresh = false } else if (!cur.includes('.')) cur += '.' }
    else if (b === 'C') { cur = '0'; a = null; op = null; fresh = false }
    else if (b === '') { cur = (cur.length > 1 && cur !== 'Error') ? cur.slice(0, -1) : '0' }
    else if (b === '±') { if (cur !== '0' && cur !== 'Error') cur = cur.startsWith('-') ? cur.slice(1) : '-' + cur }
    else if (b === '%') { setNum(rd(parseFloat(cur) / 100)); fresh = true }
    else if ('÷×−+'.includes(b)) {
        if (cur === 'Error') cur = '0'; const v = parseFloat(cur);
        if (a !== null && op && !fresh) setNum(apply(a, op, v)); else setNum(v);
        if (cur !== 'Error') a = parseFloat(cur); op = b; fresh = true
    }
    else if (b === '=') { if (op !== null && a !== null) { setNum(apply(a, op, parseFloat(cur))); a = null; op = null; fresh = true } }
    disp()
}
const KEYS = ['C', '±', '%', '÷', '7', '8', '9', '×', '4', '5', '6', '−', '1', '2', '3', '+', '⌫', '0', '.', '='];

// FUNGSI PERHITUNGAN LAINNYA
function pctCalc() { const el = $('pr'); if (!el) return; const x = parseFloat($('px').value) || 0, y = parseFloat($('py').value) || 0; el.textContent = pctMode === 1 ? fmt(x / 100 * y) : fmt(y ? x / y * 100 : NaN) + '%' }
function discCalc() { const el = $('dRes'); if (!el) return; const L = L0(), p = parseFloat($('dPrice').value) || 0, d = parseFloat($('dPct').value) || 0; el.innerHTML = L.final + ': ' + fmt(p * (1 - d / 100)) + '<small>' + L.save2 + ': ' + fmt(p * d / 100) + '</small>' }
function tipCalc() { const el = $('tRes'); if (!el) return; const L = L0(), b = parseFloat($('tBill').value) || 0, t = parseFloat($('tPct').value) || 0, n = Math.max(1, parseFloat($('tPpl').value) || 1); const tip = b * t / 100; el.innerHTML = L.tipRes + ': ' + fmt(tip) + ' · ' + L.totRes + ': ' + fmt(b + tip) + '<small>' + L.perRes + ': ' + fmt((b + tip) / n) + '</small>' }
function splitCalc() { const el = $('sRes'); if (!el) return; const t = parseFloat($('sTotal').value) || 0, n = Math.max(1, parseFloat($('sPpl').value) || 1); el.innerHTML = L0().perRes + ': ' + fmt(t / n) }
function bmiCalc() { const el = $('bRes'); if (!el) return; const w = parseFloat($('bW').value) || 0, h = parseFloat($('bH').value) || 0; if (!w || !h) { el.textContent = '—'; return } const b = w / Math.pow(h / 100, 2); el.innerHTML = fmt(b) + ' — ' + L0().bmiCat[b < 18.5 ? 0 : b < 25 ? 1 : b < 30 ? 2 : 3] }
function ageCalc() {
    const el = $('ageRes'); if (!el) return; const L = L0(), v = $('dob').value;
    if (!v) { el.textContent = '—'; return }
    const b = new Date(v + 'T12:00:00'), n = new Date();
    let y = n.getFullYear() - b.getFullYear(), m = n.getMonth() - b.getMonth(), d = n.getDate() - b.getDate();
    if (d < 0) { m--; d += new Date(n.getFullYear(), n.getMonth(), 0).getDate() }
    if (m < 0) { y--; m += 12 }
    let nb = new Date(n.getFullYear(), b.getMonth(), b.getDate(), 12); if (nb <= n) nb = new Date(n.getFullYear() + 1, b.getMonth(), b.getDate(), 12);
    el.innerHTML = y + ' ' + L.yL + ' ' + m + ' ' + L.mL + ' ' + d + ' ' + L.dL + '<small>' + L.totD + ': ' + fmt(Math.floor((n - b) / 864e5)) + ' · ' + L.nb + ': ' + fmt(Math.ceil((nb - n) / 864e5)) + ' ' + L.dL + '</small>'
}
function diffCalc() { const el = $('diffRes'); if (!el) return; const L = L0(), x = $('dd1').value, y = $('dd2').value; if (!x || !y) { el.textContent = '—'; return } const d = Math.round(Math.abs(new Date(y) - new Date(x)) / 864e5); el.innerHTML = fmt(d) + ' ' + L.dL + '<small>≈ ' + fmt(d / 7) + ' ' + L.wk + ' · ≈ ' + fmt(d / 30.44) + ' ' + L.mo + '</small>' }
function zakatCalc() {
    const el = $('zRes'); if (!el) return; const L = L0();
    if (zakMode === 'mal') { const g = parseFloat($('zGold').value) || 0, as = parseFloat($('zAssets').value) || 0, nis = g * 85; if (nis > 0 && as >= nis) el.innerHTML = L.due + '<small>' + L.nisab + ': ' + fmt(nis) + ' · ' + L.zRes + ': ' + fmt(as * 0.025) + '</small>'; else el.innerHTML = L.notDue + '<small>' + L.nisab + ': ' + fmt(nis) + '</small>' }
    else { const n = Math.max(0, parseFloat($('zPpl').value) || 0), r = parseFloat($('zRice').value) || 0; el.innerHTML = L.kgF + ': ' + fmt(2.5 * n) + ' kg<small>' + L.amtF + ': ' + fmt(2.5 * n * r) + '</small>' }
}
function loanCalc() { const el = $('lRes'); if (!el) return; const L = L0(), P = parseFloat($('lP').value) || 0, apr = parseFloat($('lApr').value) || 0, n = Math.max(1, parseFloat($('lN').value) || 1); const r = apr / 100 / 12; const m = r > 0 ? P * r / (1 - Math.pow(1 + r, -n)) : P / n; el.innerHTML = L.monthly + ': ' + fmt(m) + '<small>' + L.totInt + ': ' + fmt(m * n - P) + '</small>' }
function intCalc() { const el = $('iRes'); if (!el) return; const L = L0(), P = parseFloat($('iP').value) || 0, apr = parseFloat($('iApr').value) || 0, n = Math.max(1, parseFloat($('iM').value) || 1); const g = P * apr / 100 * n / 12; el.innerHTML = L.gain + ': ' + fmt(g) + '<small>' + L.totRes + ': ' + fmt(P + g) + '</small>' }
function saveCalc() { const el = $('vRes'); if (!el) return; const L = L0(), s = parseFloat($('vS').value) || 0, apr = parseFloat($('vApr').value) || 0, y = Math.max(0, parseFloat($('vY').value) || 0); const r = apr / 100 / 12, n = y * 12; const fv = r > 0 ? s * (Math.pow(1 + r, n) - 1) / r : s * n; el.innerHTML = L.fv + ': ' + fmt(fv) + '<small>' + L.gain + ': ' + fmt(fv - s * n) + '</small>' }
function taxCalc() { const el = $('xRes'); if (!el) return; const L = L0(), rev = parseFloat($('xRev').value) || 0; el.innerHTML = L.taxM + ': ' + fmt(rev * 0.005) + '<small>' + L.taxY + ': ' + fmt(rev * 0.005 * 12) + '</small>' }
function roiCalc() { const el = $('rRes'); if (!el) return; const L = L0(), c = parseFloat($('rC').value) || 0, s = parseFloat($('rS').value) || 0; const p = s - c; el.innerHTML = L.profit + ': ' + fmt(p) + '<small>' + L.margin + ': ' + fmt(s ? p / s * 100 : NaN) + '% · ' + L.roiL + ': ' + fmt(c ? p / c * 100 : NaN) + '%</small>' }
function gcd(x, y) { x = Math.abs(x); y = Math.abs(y); while (y) { const t = y; y = x % y; x = t } return x }
function fpbCalc() { const el = $('fRes'); if (!el) return; const a = Math.round(parseFloat($('fA').value)) || 0, b = Math.round(parseFloat($('fB').value)) || 0; if (!a || !b) { el.textContent = '—'; return } const g = gcd(a, b); el.innerHTML = 'FPB: ' + fmt(g) + ' · KPK: ' + fmt(a / g * b) }
function fracCalc() { const el = $('frRes'); if (!el) return; const L = L0(), n = Math.round(parseFloat($('frN').value)) || 0, d = Math.round(parseFloat($('frD').value)) || 0; if (!d) { el.textContent = '—'; return } const g = gcd(n, d) || 1; el.innerHTML = L.simp + ': ' + (n / g) + '/' + (d / g) + '<small>' + L.dec + ': ' + fmt(n / d) + '</small>' }
const ROM = [[1000, 'M'], [900, 'CM'], [500, 'D'], [400, 'CD'], [100, 'C'], [90, 'XC'], [50, 'L'], [40, 'XL'], [10, 'X'], [9, 'IX'], [5, 'V'], [4, 'IV']];
function toRoman(n) { let s = ''; for (const [v, r] of ROM) { while (n >= v) { s += r; n -= v } } return s }
function fromRoman(s) { s = (s || '').toUpperCase().trim(); if (!s) return NaN; let t = 0, i = 0; for (let k = 0; k < ROM.length; k++) { const [v, r] = ROM[k]; while (s.startsWith(r, i)) { t += v; i += r.length } } return i === s.length ? t : NaN }
function romanCalc() { const el = $('roRes'); if (!el) return; const n = Math.round(parseFloat($('roN').value)); const r = $('roR').value.trim(); const out = []; if (n >= 1 && n <= 3999) out.push(n + ' = ' + toRoman(n)); if (r) out.push(r + ' = ' + fmt(fromRoman(r))); el.textContent = out.length ? out.join(' · ') : '—' }
function geoCalc() {
    const el = $('gRes'); if (!el) return; const L = L0();
    if (geoMode === 'r') { const p = parseFloat($('gP').value) || 0, l = parseFloat($('gL').value) || 0; el.innerHTML = L.area + ': ' + fmt(p * l) + '<small>' + L.peri + ': ' + fmt(2 * (p + l)) + '</small>' }
    else if (geoMode === 'c') { const r = parseFloat($('gRr').value) || 0; el.innerHTML = L.area + ': ' + fmt(Math.PI * r * r) + '<small>' + L.peri + ': ' + fmt(2 * Math.PI * r) + '</small>' }
    else { const a = parseFloat($('gA').value) || 0, h = parseFloat($('gH').value) || 0, s1 = parseFloat($('gS1').value) || 0, s2 = parseFloat($('gS2').value) || 0, s3 = parseFloat($('gS3').value) || 0; const per = (s1 && s2 && s3) ? s1 + s2 + s3 : NaN; el.innerHTML = L.area + ': ' + fmt(a * h / 2) + '<small>' + L.peri + ': ' + fmt(per) + '</small>' }
}
function ipkCalc() { const el = $('ipRes'); if (!el) return; let ts = 0, tg = 0; for (let i = 0; i < 6; i++) { const s = parseFloat($('ip' + i + 's').value) || 0, g = parseFloat($('ip' + i + 'g').value) || 0; if (s > 0) { ts += s; tg += s * g } } el.textContent = ts ? fmt(tg / ts) : '—' }
const UNITS = { len: { km: 1000, m: 1, cm: 0.01, mm: 0.001, mi: 1609.344, ft: 0.3048, in: 0.0254 }, wgt: { kg: 1, g: 0.001, mg: 0.000001, ton: 1000, lb: 0.45359237, oz: 0.028349523125 } };
function unitFill() { const c = $('uCat').value; const opts = c === 'tmp' ? ['°C', '°F', 'K'] : Object.keys(UNITS[c]); $('uF').innerHTML = opts.map(o => '<option>' + o + '</option>').join(''); $('uT').innerHTML = opts.map(o => '<option>' + o + '</option>').join(''); if (opts.length > 1) $('uT').selectedIndex = 1 }
function unitCalc() { const el = $('uRes'); if (!el) return; const c = $('uCat').value, v = parseFloat($('uV').value) || 0, f = $('uF').value, t = $('uT').value; let r; if (c === 'tmp') { const cel = f === '°C' ? v : f === '°F' ? (v - 32) * 5 / 9 : v - 273.15; r = t === '°C' ? cel : t === '°F' ? cel * 9 / 5 + 32 : cel + 273.15 } else r = v * UNITS[c][f] / UNITS[c][t]; el.textContent = fmt(v) + ' ' + f + ' = ' + fmt(r) + ' ' + t }
function bbmCalc() { const el = $('bbRes'); if (!el) return; const L = L0(), d = parseFloat($('bbD').value) || 0, c = parseFloat($('bbC').value) || 0, p = parseFloat($('bbP').value) || 0; const l = c ? d / c : NaN; el.innerHTML = L.fuelL + ': ' + fmt(l) + '<small>' + L.fuelC + ': ' + fmt(l * p) + '</small>' }
function paintCalc() { const el = $('cpRes'); if (!el) return; const L = L0(), p = parseFloat($('cpP').value) || 0, h = parseFloat($('cpH').value) || 0, c = Math.max(1, parseFloat($('cpC').value) || 1), cov = parseFloat($('cpCov').value) || 0; const area = p * h; const liters = area * c / cov; el.innerHTML = L.paintL + ': ' + fmt(liters) + ' L<small>Luas: ' + fmt(area) + ' m² · ' + c + ' lapis</small>' }

// NAVIGASI & EVENT LISTENER
function renderMenu() { $('t').textContent = T[lang].t; $('content').innerHTML = menuHTML() }
function renderTool(id) { $('t').textContent = T[lang][id] || id; $('content').innerHTML = toolHTML(id); view = id; attachEvents() }

function attachEvents() {
    // Tombol kembali
    document.querySelectorAll('[data-back]').forEach(b => b.onclick = renderMenu);
    
    // Tombol menu alat - LANGSUNG BUKA TANPA CEK PREMIUM
    document.querySelectorAll('[data-tool]').forEach(b => b.onclick = () => renderTool(b.dataset.tool));

    // Kalkulator
    if (view === 'calc') {
        $('keys').innerHTML = KEYS.map(b => '<button onclick="calc(\'' + b + '\')" class="' + (b === '=' ? 'eq' : b === 'C' ? 'cl' : '÷×−+'.includes(b) ? 'op' : '') + '">' + b + '</button>').join('')
    }
    // Persentase
    if (view === 'pct') {
        $('pm1').onclick = () => { pctMode = 1; $('pm1').classList.add('on'); $('pm2').classList.remove('on'); pctCalc() };
        $('pm2').onclick = () => { pctMode = 2; $('pm2').classList.add('on'); $('pm1').classList.remove('on'); pctCalc() };
        ['px', 'py'].forEach(id => $(id).oninput = pctCalc)
    }
    // Diskon
    if (view === 'disc') { ['dPrice', 'dPct'].forEach(id => $(id).oninput = discCalc) }
    // Tip
    if (view === 'tip') { ['tBill', 'tPct', 'tPpl'].forEach(id => $(id).oninput = tipCalc) }
    // Split
    if (view === 'split') { ['sTotal', 'sPpl'].forEach(id => $(id).oninput = splitCalc) }
    // BMI
    if (view === 'bmi') { ['bW', 'bH'].forEach(id => $(id).oninput = bmiCalc) }
    // Umur
    if (view === 'age') { $('dob').oninput = ageCalc }
    // Selisih tanggal
    if (view === 'diff') { ['dd1', 'dd2'].forEach(id => $(id).oninput = diffCalc) }
    // Zakat
    if (view === 'zakat') {
        $('zm').onclick = () => { zakMode = 'mal'; $('zm').classList.add('on'); $('zf').classList.remove('on'); $('malBox').hidden = false; $('fitBox').hidden = true; zakatCalc() };
        $('zf').onclick = () => { zakMode = 'fit'; $('zf').classList.add('on'); $('zm').classList.remove('on'); $('fitBox').hidden = false; $('malBox').hidden = true; zakatCalc() };
        ['zGold', 'zAssets', 'zPpl', 'zRice'].forEach(id => $(id).oninput = zakatCalc)
    }
    // Cicilan
    if (view === 'loan') { ['lP', 'lApr', 'lN'].forEach(id => $(id).oninput = loanCalc) }
    // Bunga
    if (view === 'interest') { ['iP', 'iApr', 'iM'].forEach(id => $(id).oninput = intCalc) }
    // Tabungan
    if (view === 'save') { ['vS', 'vApr', 'vY'].forEach(id => $(id).oninput = saveCalc) }
    // Pajak
    if (view === 'tax') { $('xRev').oninput = taxCalc }
    // ROI
    if (view === 'roi') { ['rC', 'rS'].forEach(id => $(id).oninput = roiCalc) }
    // FPB
    if (view === 'fpb') { ['fA', 'fB'].forEach(id => $(id).oninput = fpbCalc) }
    // Pecahan
    if (view === 'frac') { ['frN', 'frD'].forEach(id => $(id).oninput = fracCalc) }
    // Romawi
    if (view === 'roman') { ['roN', 'roR'].forEach(id => $(id).oninput = romanCalc) }
    // Bangun
    if (view === 'geo') {
        $('gR').onclick = () => { geoMode = 'r'; $('gR').classList.add('on'); $('gC').classList.remove('on'); $('gT').classList.remove('on'); $('geoR').hidden = false; $('geoC').hidden = true; $('geoT').hidden = true; geoCalc() };
        $('gC').onclick = () => { geoMode = 'c'; $('gC').classList.add('on'); $('gR').classList.remove('on'); $('gT').classList.remove('on'); $('geoC').hidden = false; $('geoR').hidden = true; $('geoT').hidden = true; geoCalc() };
        $('gT').onclick = () => { geoMode = 't'; $('gT').classList.add('on'); $('gR').classList.remove('on'); $('gC').classList.remove('on'); $('geoT').hidden = false; $('geoR').hidden = true; $('geoC').hidden = true; geoCalc() };
        ['gP', 'gL', 'gRr', 'gA', 'gH', 'gS1', 'gS2', 'gS3'].forEach(id => { const el = $(id); if (el) el.oninput = geoCalc })
    }
    // IPK
    if (view === 'ipk') { for (let i = 0; i < 6; i++) { ['ip' + i + 's', 'ip' + i + 'g'].forEach(id => { const el = $(id); if (el) el.oninput = ipkCalc }) } }
    // Satuan
    if (view === 'unit') { $('uCat').onchange = unitFill; $('uF').onchange = unitCalc; $('uT').onchange = unitCalc; $('uV').oninput = unitCalc; unitFill() }
    // BBM
    if (view === 'bbm') { ['bbD', 'bbC', 'bbP'].forEach(id => $(id).oninput = bbmCalc) }
    // Cat
    if (view === 'cat2') { ['cpP', 'cpH', 'cpC', 'cpCov'].forEach(id => $(id).oninput = paintCalc) }
    // Biner
    if (view === 'bin') { $('bnD').oninput = () => { const v = parseFloat($('bnD').value) || 0; $('bnB').value = v.toString(2); $('bnH').value = v.toString(16).toUpperCase(); $('bnRes').textContent = 'Dec → Bin/Hex' } }
}

// Ganti Bahasa
$('lang').onclick = () => { lang = lang === 'id' ? 'en' : 'id'; localStorage.setItem(LKEY, lang); renderMenu() };

// Jalankan pertama kali
renderMenu();
</script>
