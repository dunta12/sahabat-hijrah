<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support Sahabat Hijrah</title>
    <style>
        /* Gaya dasar agar senada dengan aplikasi */
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: #f5f5dc; 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
        }
        .card { 
            background: white; 
            padding: 30px; 
            border-radius: 20px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            max-width: 400px; 
            width: 100%; 
            text-align: center; 
        }
        h2 { color: #1b5e20; margin-top: 0; font-size: 24px; }
        p { color: #555; line-height: 1.6; font-size: 15px; margin-bottom: 20px; }
        
        /* Gaya untuk Gambar QRIS */
        .qris-img { 
            width: 100%; 
            max-width: 280px; 
            border-radius: 12px; 
            border: 1px solid #eee; 
            margin: 10px 0; 
        }
        
        /* Catatan Merchant */
        .merchant-note { 
            font-size: 12px; 
            color: #888; 
            margin-top: 15px; 
            font-style: italic; 
            background: #f9f9f9; 
            padding: 10px; 
            border-radius: 8px; 
        }
        .merchant-name { font-weight: bold; color: #333; display: block; margin-top: 5px; }

        /* Tombol Kembali */
        .back-btn { 
            display: inline-block; 
            margin-top: 25px; 
            padding: 12px 25px; 
            background-color: #1b5e20; 
            color: white; 
            text-decoration: none; 
            border-radius: 50px; 
            font-weight: bold; 
            transition: background 0.3s;
        }
        .back-btn:hover { background-color: #144515; }
    </style>
</head>
<body>

    <div class="card">
        <!-- Judul -->
        <h2> Voluntary Donation</h2>
        
        <!-- Penjelasan Singkat (Bahasa Inggris) -->
        <p>This app is free. If it benefits your worship, please consider a voluntary donation to help us keep improving.</p>
        
        <!-- Gambar QRIS (Sama dengan versi Indonesia) -->
        <img src="qris-donasi.png" alt="QRIS Donation Sahabat Hijrah" class="qris-img">
        
        <!-- Catatan Nama Merchant (TETAP SAMA, JANGAN DITERJEMAHKAN) -->
        <div class="merchant-note">
            Payments are processed via our official merchant:<br>
            <span class="merchant-name">"DUNIA BERCERITA, PERCETAKAN & BUKU"</span>
        </div>

        <!-- Tombol Kembali ke Aplikasi (Link ke en.html) -->
        <a href="en.html" class="back-btn">← Back to App</a>
    </div>

</body>
</html>
