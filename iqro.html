<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1e5b46">
<title>Iqro — Sahabat Hijrah</title>
<style>
:root{--green:#1e5b46;--yellow:#ffd200;--bg:#efece4;--card:#f8f8f6;--text:#21302b;--muted:#7d8a83}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);padding-bottom:24px;min-height:100vh}
header{position:sticky;top:0;z-index:100;background:var(--green);color:#fff;display:flex;align-items:center;gap:4px;padding:10px 8px}
header a{color:#fff;text-decoration:none;font-size:20px;line-height:1;flex-shrink:0}
header h1{font-size:14px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
header button{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:50%;width:32px;height:32px;font-size:14px;flex-shrink:0;display:flex;align-items:center;justify-content:center;padding:0}
#btnMenuBack{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:16px;width:auto;padding:4px 8px;font-size:11px;font-weight:600;display:none;gap:3px}
#btnMenuBack.show{display:flex}
.wrap{padding:10px 12px 0}
.card{background:var(--card);border-radius:18px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.seg{display:flex;gap:6px;margin:8px 0;flex-wrap:wrap}
.seg.hidden{display:none!important}
.seg button{flex:1;padding:10px 4px;border-radius:12px;border:1px solid #cfd8d3;background:#fff;font-size:11px;color:var(--text);cursor:pointer;font-weight:600;min-width:80px}
.seg button.on{background:var(--green);color:#fff;border-color:var(--green)}
.ar{font-size:64px;text-align:center;padding:26px 10px;background:#fff;border-radius:16px;direction:rtl;font-family:"Amiri","Scheherazade New","Noto Naskh Arabic",serif;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.06);line-height:1.6}
.info{margin-top:10px;background:#e2efe8;border-radius:12px;padding:12px;text-align:center;font-weight:700;color:var(--green);min-height:22px;font-size:15px}
.info small{display:block;font-weight:500;color:var(--muted);margin-top:4px}
.row{display:flex;gap:8px;justify-content:center;margin-top:12px}
.row button{border:none;border-radius:12px;padding:12px 18px;font-size:15px;font-weight:600;background:var(--green);color:#fff;cursor:pointer}
.row button.alt{background:#e2efe8;color:var(--green)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.opts button{border:1px solid #cfd8d3;background:#fff;border-radius:12px;padding:14px;font-size:16px;cursor:pointer;color:var(--text);font-weight:600}
.opts button.ok{background:#d9f2e3;border-color:var(--green)}
.opts button.no{background:#fde3e3;border-color:#c66}
.score{text-align:center;font-size:13px;color:var(--muted);margin-top:10px;font-weight:600}
.note{font-size:11px;color:var(--muted);line-height:1.6;background:#f3efe2;border-radius:10px;padding:10px;margin-top:12px;font-weight:500}

/* === MODE TULIS - FULLSCREEN DI BAWAH HEADER === */
#canvasFullscreen{display:none;position:fixed;top:52px;left:0;right:0;bottom:0;background:var(--bg);z-index:50;overflow-y:auto}
#canvasFullscreen.show{display:flex;flex-direction:column}
.canvas-wrap{flex:1;display:flex;flex-direction:column;padding:8px;min-height:0}
.letter-ref{display:flex;align-items:center;justify-content:center;gap:8px;padding:6px 10px;background:#fff;border-radius:10px;margin-bottom:6px;flex-shrink:0;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.letter-ref .ar-ref{font-size:36px;font-family:"Amiri","Scheherazade New","Noto Naskh Arabic",serif;color:var(--green);direction:rtl;line-height:1}
.letter-ref .nama-ref{font-size:12px;color:var(--muted);font-weight:600}
.canvas-box{flex:1;width:100%;background:#fafafa;border:2px dashed #cfd8d3;border-radius:12px;touch-action:none;cursor:crosshair;display:block;min-height:0}
.canvas-tools{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;flex-shrink:0}
.canvas-tools button{flex:1;min-width:70px;padding:12px 8px;border:none;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s}
.btn-clear{background:#fde3e3;color:#c66}
.btn-eraser{background:#fff3e0;color:#e67e22;border:2px solid #e67e22}
.btn-eraser.active{background:#e67e22;color:#fff}
.btn-save{background:#d9f2e3;color:var(--green)}
.btn-next{background:var(--green);color:#fff}
.color-pick{display:flex;gap:6px;justify-content:center;margin-top:8px;flex-wrap:wrap;flex-shrink:0}
.color-pick span{width:32px;height:32px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:transform .15s}
.color-pick span.on{border-color:var(--green);transform:scale(1.15)}
.eraser-size{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:6px;font-size:11px;color:var(--muted);flex-shrink:0}
.eraser-size input{width:100px}
.canvas-info{font-size:11px;color:var(--muted);text-align:center;margin-top:6px;flex-shrink:0}

/* === TOAST NOTIFICATION === */
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(120px);background:var(--green);color:#fff;padding:14px 18px;border-radius:14px;box-shadow:0 6px 20px rgba(0,0,0,.25);font-size:13px;z-index:9999;opacity:0;transition:all .35s cubic-bezier(.4,0,.2,1);max-width:88%;text-align:center;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
.toast .t-title{font-weight:700;margin-bottom:3px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:14px}
.toast .t-loc{font-size:11px;color:#d9f2e3;margin-bottom:8px}
.toast .t-btn{background:#fff;color:var(--green);border:none;padding:7px 14px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;margin-top:2px}
</style>
</head>
<body>

<header>
<a href="index.html">←</a>
<h1 id="t"></h1>
<button id="btnMenuBack" onclick="backToMenu()">← Menu</button>
<button id="lang">🌐</button>
</header>

<div class="wrap"><div class="card">
<div class="seg" id="lv"></div>
<div class="seg" id="md"></div>
<div id="area"></div>
<div class="note" id="dis"></div>
</div></div>

<!-- CANVAS FULLSCREEN (di bawah header) -->
<div id="canvasFullscreen">
    <div class="canvas-wrap">
        <div class="letter-ref">
            <div class="ar-ref" id="refArab"></div>
            <div class="nama-ref" id="refNama"></div>
        </div>
        <canvas id="cvTulis" class="canvas-box"></canvas>
        <div class="color-pick" id="colPick"></div>
        <div class="eraser-size" id="eraserSizeCtrl" style="display:none">
            <span>Ukuran:</span>
            <input type="range" id="eraserRange" min="10" max="50" value="20">
            <span id="eraserVal">20px</span>
        </div>
        <div class="canvas-tools">
            <button class="btn-eraser" id="btnEraser" onclick="toggleEraser()"> Hapus</button>
            <button class="btn-clear" onclick="clearCv()">🗑️ Semua</button>
            <button class="btn-save" onclick="saveCv()">💾 Simpan</button>
            <button class="btn-next" onclick="nextTulis()">➡️</button>
        </div>
        <div class="canvas-info" id="canvasInfo"></div>
    </div>
</div>

<!-- Toast Notification -->
<div id="toastNotif" class="toast">
    <div class="t-title">📥 Tersimpan!</div>
    <div class="t-loc" id="toastLoc">📁 Folder Downloads</div>
    <button class="t-btn" onclick="shareTulis()">📤 Bagikan / Lihat</button>
</div>

<script>
const $=id=>document.getElementById(id);

let lang=localStorage.getItem('sh_lang')||'id';
let lv=0,md=0,i=0,rev=false;
let score=0,total=0,qItem=null,qOpts=[];

const L={
id:{
t:'Iqro - Belajar Baca',
lv:['Hijaiyah','Harakat','Tanwin','Kata','Mad'],
md:['📖 Belajar','🎯 Kuis','🎨 Tulis'],
tap:'Ketuk kartu untuk melihat nama & bacaan',
q:'Mana bacaan yang benar?',
score:'Skor',
write:'Tiru huruf di atas, lalu simpan karyamu!',
dis:'⚠️ Materi di halaman ini adalah latihan huruf Arab ASLI bergaya metode Iqro\', BUKAN salinan atau scan buku Iqro\'. Buku Iqro\' (K.H. As\'ad Humam) dilindungi hak cipta. Dukung penulis dengan membeli buku aslinya.'
},
en:{
t:'Iqro - Learn to Read',
lv:['Hijaiyah','Harakat','Tanwin','Words','Madd'],
md:['📖 Learn','🎯 Quiz','🎨 Write'],
tap:'Tap the card to see name & reading',
q:'Which is the correct reading?',
score:'Score',
write:'Copy the letter above, then save your work!',
dis:'⚠️ The material here is ORIGINAL Arabic-letter practice in the style of the Iqro\' method, NOT a copy or scan of the Iqro\' book. The Iqro\' book (K.H. As\'ad Humam) is copyrighted. Support the author by buying the original.'
}
};

const HIJ=[
['ا','Alif','a',''],
['ب','Ba','ba','b'],
['ت','Ta','ta','t'],
['ث','Tsa','tsa','ts'],
['ج','Jim','jim','j'],
['ح','Ha','ha','h'],
['خ','Kho','kho','kh'],
['د','Dal','dal','d'],
['ذ','Dzal','dzal','dz'],
['ر','Ro','ro','r'],
['ز','Zai','zai','z'],
['س','Sin','sin','s'],
['ش','Syin','syin','sy'],
['ص','Shod','shod','sh'],
['ض','Dhod','dhod','dh'],
['ط','Tho','tho','th'],
['ظ','Zho','zho','zh'],
['ع','Ain','ain',''],
['غ','Ghain','ghain','gh'],
['ف','Fa','fa','f'],
['ق','Qof','qof','q'],
['ك','Kaf','kaf','k'],
['ل','Lam','lam','l'],
['م','Mim','mim','m'],
['ن','Nun','nun','n'],
['و','Wau','wau','w'],
['هـ','Ha','ha','h'],
['ء','Hamzah','hamzah',''],
['ي','Ya','ya','y'],
['لا','Lam-Alif','la','la']
];

const VOW=[['َ','a','fathah'],['ِ','i','kasrah'],['ُ','u','dhammah']];

const HAR=[];
HIJ.slice(1,11).forEach(h=>{
VOW.forEach(v=>{
HAR.push({
ar:h[0]+v[0],
lab:h[1]+' + '+v[2],
read:h[3]+v[1]
});
});
});

const TAN=[
{ar:'بٌ',lab:'ba + dhammatain',read:'bun'},
{ar:'بٍ',lab:'ba + kasratain',read:'bin'},
{ar:'بًا',lab:'ba + fathatain',read:'ban'},
{ar:'أَبْ',lab:'ba sukun',read:'ab'},
{ar:'مِنْ',lab:'nun sukun',read:'min'},
{ar:'إِنْ',lab:'nun sukun',read:'in'},
{ar:'قُلْ',lab:'lam sukun',read:'qul'}
];

const KATA=[
{ar:'كَتَبَ',lab:'menulis',read:'kataba'},
{ar:'قَرَأَ',lab:'membaca',read:'qara-a'},
{ar:'بَيْتٌ',lab:'rumah',read:'baitun'},
{ar:'مَسْجِدٌ',lab:'masjid',read:'masjidun'},
{ar:'عَبْدُ',lab:'hamba',read:'abdu'},
{ar:'رَحِيمٌ',lab:'Maha Penyayang',read:'rahiim'},
{ar:'نَسْتَعِينُ',lab:'mohon pertolongan',read:'nasta-iin'},
{ar:'اَلْحَمْدُ',lab:'pujian',read:'al-hamdu'}
];

const MAD=[
{ar:'بَا',lab:'mad thabi\'i',read:'baa'},
{ar:'بِي',lab:'mad thabi\'i',read:'bii'},
{ar:'بُو',lab:'mad thabi\'i',read:'buu'},
{ar:'قَا',lab:'mad thabi\'i',read:'qaa'},
{ar:'مِي',lab:'mad thabi\'i',read:'mii'},
{ar:'نُو',lab:'mad thabi\'i',read:'nuu'},
{ar:'دَا',lab:'mad thabi\'i',read:'daa'},
{ar:'سِي',lab:'mad thabi\'i',read:'sii'}
];

function items(){
return [
HIJ.map(h=>({ar:h[0],lab:h[1],read:h[2]})),
HAR,TAN,KATA,MAD
][lv];
}

function pick(a){return a[Math.floor(Math.random()*a.length)];}

function opts(list,it){
const s=new Set([it.read]);
while(s.size<4&&s.size<list.length){
s.add(pick(list).read);
}
return [...s].sort(()=>Math.random()-0.5);
}

let VOICES=[];
function loadVoices(){try{VOICES=speechSynthesis.getVoices();}catch(e){}}
if('speechSynthesis' in window){
  loadVoices();
  speechSynthesis.onvoiceschanged=loadVoices;
}
function arVoice(){
  if(!VOICES.length)loadVoices();
  return VOICES.find(v=>/^ar[-_]/i.test(v.lang))||VOICES.find(v=>/^ar/i.test(v.lang))||null;
}
let LASTU=null;
let INFO0='';
const PAKAI_MP3=true;
function senyap(){if($('inf')&&$('inf').dataset.warn==='1'){$('inf').innerHTML=INFO0;delete $('inf').dataset.warn;}}
setInterval(()=>{if(VOICES.length&&$('inf')&&$('inf').dataset.warn==='1')senyap();},3000);
function bunyi(it,idx){
  if(PAKAI_MP3){
    const pre=['h','r','t','k','m'][lv];
    const a=new Audio('suara-iqro/'+pre+String(idx+1).padStart(2,'0')+'.mp3');
    a.play().then(senyap).catch(()=>speak(it.ar));
    return;
  }
  speak(it.ar);
}
function speak(t){
  const pesan=(lang==='id')
    ?'🔇 Tidak ada suara Arab di perangkat/browser ini. Naikkan volume media & pasang bahasa Arab di pengaturan Text-to-speech.'
    :'🔇 No Arabic voice on this device/browser. Raise media volume & install Arabic in Text-to-speech settings.';
  const v=arVoice();
  if(!('speechSynthesis' in window)||!v){
    if($('inf')){$('inf').innerHTML=pesan+' <small>('+((('speechSynthesis' in window)&&VOICES.length)?('suara terdeteksi: '+VOICES.length+', tiada kode "ar"'):'daftar suara masih kosong')+')</small>';$('inf').dataset.warn='1';}
    return;
  }
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(t);
    u.voice=v;u.lang=v.lang;u.rate=0.7;
    LASTU=u;
    senyap();
    setTimeout(()=>speechSynthesis.speak(u),80);
  }catch(e){
    if($('inf')){$('inf').innerHTML=pesan;$('inf').dataset.warn='1';}
  }
}

function learn(){
$('btnMenuBack').classList.remove('show');
$('lv').classList.remove('hidden');
$('md').classList.remove('hidden');
$('canvasFullscreen').classList.remove('show');
const T=L[lang];
const list=items();
const it=list[i];
$('area').innerHTML=
'<div class="ar" id="card">'+it.ar+'</div>'+
'<div class="info" id="inf">'+
(rev?it.lab+'<small>'+it.read+'</small>':T.tap)+
'</div>'+
'<div class="row">'+
'<button id="pv" class="alt">←</button>'+
'<button id="sp"></button>'+
'<button id="nx">→</button>'+
'</div>'+
'<div class="score">'+(i+1)+' / '+list.length+'</div>';
if($('inf')){INFO0=$('inf').innerHTML;delete $('inf').dataset.warn;}
$('card').onclick=()=>{rev=!rev;learn();};
$('sp').onclick=()=>bunyi(it,i);
$('pv').onclick=()=>{i=(i-1+list.length)%list.length;rev=false;learn();};
$('nx').onclick=()=>{i=(i+1)%list.length;rev=false;learn();};
}

function quiz(){
$('btnMenuBack').classList.remove('show');
$('lv').classList.remove('hidden');
$('md').classList.remove('hidden');
$('canvasFullscreen').classList.remove('show');
const T=L[lang];
const list=items();
if(!qItem){qItem=pick(list);qOpts=opts(list,qItem);}
$('area').innerHTML=
'<div class="ar">'+qItem.ar+'</div>'+
'<div class="info">'+T.q+'</div>'+
'<div class="opts" id="op">'+
qOpts.map((o,x)=>'<button data-x="'+x+'">'+o+'</button>').join('')+
'</div>'+
'<div class="score" id="sc">'+T.score+': '+score+' / '+total+'</div>';
$('op').querySelectorAll('button').forEach(b=>{
b.onclick=()=>{
const ok=b.textContent===qItem.read;
total++;
if(ok){score++;b.classList.add('ok');}
else{b.classList.add('no');$('op').querySelectorAll('button').forEach(x=>{if(x.textContent===qItem.read)x.classList.add('ok');});}
$('op').querySelectorAll('button').forEach(x=>x.disabled=true);
$('sc').textContent=T.score+': '+score+' / '+total;
setTimeout(()=>{qItem=null;quiz();},900);
};
});
}

/* ===== FITUR BELAJAR MENULIS - FULLSCREEN ===== */
let cv,cx,isDraw=false,lx=0,ly=0,drawn=false;
const COLORS=['#1e5b46','#000000','#c0392b','#2980b9','#8e44ad','#d4a017'];
let curColor=COLORS[0];
let isEraser=false;
let eraserSize=20;

function tulisMode(){
    const T=L[lang];
    const list=items();
    const it=list[i];
    
    // HIDE tombol level & mode
    $('lv').classList.add('hidden');
    $('md').classList.add('hidden');
    // Tampilkan tombol Menu
    $('btnMenuBack').classList.add('show');
    // TAMPILKAN CANVAS FULLSCREEN
    $('canvasFullscreen').classList.add('show');
    
    // Update referensi huruf
    $('refArab').textContent=it.ar;
    $('refNama').textContent=it.lab;
    $('canvasInfo').textContent=T.write;
    
    // Color picker
    $('colPick').innerHTML=COLORS.map((c,x)=>`<span data-c="${c}" class="${c===curColor?'on':''}" style="background:${c}"></span>`).join('');
    $('colPick').querySelectorAll('span').forEach(s=>{
        s.onclick=()=>{
            curColor=s.dataset.c;
            $('colPick').querySelectorAll('span').forEach(x=>x.classList.remove('on'));
            s.classList.add('on');
            if(cx&&!isEraser)cx.strokeStyle=curColor;
            if(isEraser)toggleEraser();
        };
    });
    
    // Eraser slider
    $('eraserRange').value=eraserSize;
    $('eraserVal').textContent=eraserSize+'px';
    
    // Setup canvas setelah DOM update
    setTimeout(()=>setupCv(),50);
}

function setupCv(){
    cv=$('cvTulis');
    const wrap=cv.parentElement;
    // Hitung tinggi canvas: tinggi wrap - tinggi elemen lain
    const otherElements=wrap.querySelectorAll('.letter-ref,.color-pick,.eraser-size,.canvas-tools,.canvas-info');
    let otherHeight=0;
    otherElements.forEach(el=>{otherHeight+=el.offsetHeight+8;});
    const availableHeight=wrap.clientHeight-otherHeight;
    
    cv.width=wrap.clientWidth-16;
    cv.height=Math.max(availableHeight,300);
    
    cx=cv.getContext('2d');
    cx.lineWidth=window.innerWidth<400?12:16;
    cx.lineCap='round';
    cx.lineJoin='round';
    cx.strokeStyle=curColor;
    cx.fillStyle='#fafafa';
    cx.fillRect(0,0,cv.width,cv.height);
    drawn=false;
    
    cv.addEventListener('touchstart',drawStart,{passive:false});
    cv.addEventListener('touchmove',drawMove,{passive:false});
    cv.addEventListener('touchend',drawEnd);
    cv.addEventListener('touchcancel',drawEnd);
    cv.addEventListener('mousedown',drawStart);
    cv.addEventListener('mousemove',drawMove);
    cv.addEventListener('mouseup',drawEnd);
    cv.addEventListener('mouseout',drawEnd);
}

function getPos(e){
    const r=cv.getBoundingClientRect();
    const cx2=e.touches?e.touches[0].clientX:e.clientX;
    const cy2=e.touches?e.touches[0].clientY:e.clientY;
    return{x:cx2-r.left,y:cy2-r.top};
}

function drawStart(e){
    isDraw=true;
    const p=getPos(e);
    lx=p.x;ly=p.y;
    drawn=true;
    if(isEraser){
        cx.globalCompositeOperation='destination-out';
        cx.lineWidth=eraserSize;
    }else{
        cx.globalCompositeOperation='source-over';
        cx.strokeStyle=curColor;
    }
}

function drawMove(e){
    if(!isDraw)return;
    e.preventDefault();
    const p=getPos(e);
    cx.beginPath();
    cx.moveTo(lx,ly);
    cx.lineTo(p.x,p.y);
    cx.stroke();
    lx=p.x;ly=p.y;
}

function drawEnd(){
    isDraw=false;
    cx.globalCompositeOperation='source-over';
}

function toggleEraser(){
    isEraser=!isEraser;
    const btn=$('btnEraser');
    const sizeCtrl=$('eraserSizeCtrl');
    if(isEraser){
        btn.classList.add('active');
        btn.textContent='✏️ Tulis';
        sizeCtrl.style.display='flex';
        cv.style.cursor='cell';
    }else{
        btn.classList.remove('active');
        btn.textContent=' Hapus';
        sizeCtrl.style.display='none';
        cv.style.cursor='crosshair';
    }
}

function clearCv(){
    if(!cx)return;
    cx.globalCompositeOperation='source-over';
    cx.fillStyle='#fafafa';
    cx.fillRect(0,0,cv.width,cv.height);
    drawn=false;
    if(isEraser)toggleEraser();
}

function backToMenu(){
    $('btnMenuBack').classList.remove('show');
    $('lv').classList.remove('hidden');
    $('md').classList.remove('hidden');
    $('canvasFullscreen').classList.remove('show');
    md=0;
    render();
}

function saveCv(){
    if(!cv)return;
    showToast('⏳ Menyimpan...','Mohon tunggu sebentar',true);
    setTimeout(()=>{
        const ts=new Date().getTime();
        const nama=`kaligrafi-sh-${ts}.png`;
        try{
            const data=cv.toDataURL('image/png');
            const a=document.createElement('a');
            a.download=nama;
            a.href=data;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            window._lastSaved={nama,data};
            showToast('📥 Tersimpan!',`📁 ${nama} (Folder Downloads)`,false);
        }catch(err){showToast('❌ Gagal','Coba lagi ya',false);}
    },400);
}

function showToast(title,loc,isLoading){
    const t=$('toastNotif');
    const locEl=$('toastLoc');
    t.querySelector('.t-title').textContent=title;
    locEl.textContent=loc;
    const btn=t.querySelector('.t-btn');
    btn.style.display=isLoading?'none':'block';
    t.classList.add('show');
    if(!isLoading)setTimeout(()=>t.classList.remove('show'),4500);
}

function shareTulis(){
    const t=$('toastNotif');
    t.classList.remove('show');
    if(window._lastSaved && navigator.share){
        try{
            fetch(window._lastSaved.data).then(r=>r.blob()).then(blob=>{
                const file=new File([blob],window._lastSaved.nama,{type:'image/png'});
                if(navigator.canShare && navigator.canShare({files:[file]})){
                    navigator.share({files:[file],title:'Kaligrafi Sahabat Hijrah',text:'Lihat kaligrafi yang saya buat!'}).catch(()=>{});
                }else{alert('Buka folder Downloads di File Manager untuk melihat file.');}
            });
        }catch(e){alert('Buka folder Downloads di File Manager untuk melihat file.');}
    }else{alert('Buka aplikasi File Manager → folder Downloads untuk melihat file.');}
}

function nextTulis(){const list=items();i=(i+1)%list.length;tulisMode();}

let resizeTimer;
window.addEventListener('resize',()=>{
    clearTimeout(resizeTimer);
    resizeTimer=setTimeout(()=>{
        if(md===2 && cv && $('canvasFullscreen').classList.contains('show')){
            const tempData=drawn?cv.toDataURL():null;
            setupCv();
            if(tempData){const img=new Image();img.onload=()=>{cx.drawImage(img,0,0,cv.width,cv.height);};img.src=tempData;}
        }
    },200);
});
if(screen.orientation){
    screen.orientation.addEventListener('change',()=>{
        setTimeout(()=>{
            if(md===2 && cv && $('canvasFullscreen').classList.contains('show')){
                const tempData=drawn?cv.toDataURL():null;
                setupCv();
                if(tempData){const img=new Image();img.onload=()=>{cx.drawImage(img,0,0,cv.width,cv.height);};img.src=tempData;}
            }
        },300);
    });
}

function render(){
const T=L[lang];
$('t').textContent=T.t;
$('dis').textContent=T.dis;
$('lv').innerHTML=T.lv.map((n,x)=>'<button data-l="'+x+'" class="'+(x===lv?'on':'')+'">'+n+'</button>').join('');
$('md').innerHTML=T.md.map((n,x)=>'<button data-m="'+x+'" class="'+(x===md?'on':'')+'">'+n+'</button>').join('');
$('lv').querySelectorAll('button').forEach(b=>{
b.onclick=()=>{lv=+b.dataset.l;i=0;rev=false;score=0;total=0;qItem=null;render();};
});
$('md').querySelectorAll('button').forEach(b=>{
b.onclick=()=>{md=+b.dataset.m;i=0;rev=false;score=0;total=0;qItem=null;render();};
});
if(md===0)learn();
else if(md===1)quiz();
else if(md===2)tulisMode();
}

$('lang').onclick=()=>{lang=(lang==='id')?'en':'id';localStorage.setItem('sh_lang',lang);render();};
render();
</script>
</body>
</html>
