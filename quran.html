<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Al-Qur'an - Sahabat Hijrah</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif}body{background:#f6f4ee}
header{background:#1b4d3e;color:#fff;padding:14px;position:sticky;top:0;display:flex;gap:10px;align-items:center}
header a{color:#fff;text-decoration:none;font-size:20px}h1{font-size:17px}
#cari{margin:10px;padding:10px;width:calc(100% - 20px);border:1px solid #ccc;border-radius:10px}
.surah{background:#fff;margin:8px 10px;padding:12px;border-radius:12px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 1px 3px rgba(0,0,0,.08);cursor:pointer}
.surah small{color:#666}.arab{font-size:22px}
.ayat{background:#fff;margin:8px 10px;padding:12px;border-radius:12px}
.ayat .a{font-size:24px;text-align:right;direction:rtl;line-height:2}.ayat .l{color:#555;margin-top:6px}.ayat .t{margin-top:6px}
.btn{background:#1b4d3e;color:#fff;border:0;border-radius:8px;padding:6px 10px;margin:4px 2px 0 0}
.loading{text-align:center;padding:20px;color:#666}
</style></head><body>
<header><a href="index.html">←</a><h1 id="judul">Al-Qur'an</h1></header>
<div id="list"><input id="cari" placeholder="Cari surah..."><div id="daftar"><div class="loading">Memuat...</div></div></div>
<div id="detail" style="display:none"></div>
<script>
const API=['https://equran.id/apiv2','https://equran.id/api/v2'];let semua=[],audioFull={};const aud=new Audio();
async function muat(){for(const u of API){try{const r=await fetch(u+'/surah');const j=await r.json();semua=j.data||j.surat;if(semua)break;}catch(e){}}gambar(semua||[]);}
function gambar(l){daftar.innerHTML=l.map(s=>'<div class="surah" onclick="buka('+s.nomor+')"><div><b>'+s.namaLatin+'</b><br><small>'+s.arti+' • '+s.jumlahAyat+' ayat</small></div><div class="arab">'+s.nama+'</div></div>').join('');}
cari.oninput=e=>{const q=e.target.value.toLowerCase();gambar(semua.filter(s=>s.namaLatin.toLowerCase().includes(q)||String(s.nomor).includes(q)));};
async function buka(n){
  list.style.display='none';detail.style.display='block';detail.innerHTML='<div class="loading">Memuat surah...</div>';
  let s=null;for(const u of API){try{const r=await fetch(u+'/surah/'+n);const j=await r.json();s=j.data||j.surat;if(s)break;}catch(e){}}
  if(!s){detail.innerHTML='<div class="loading">Gagal memuat — cek internet.</div><div style="text-align:center"><button class="btn" onclick="kembali()">← Kembali</button></div>';return;}
  judul.textContent=s.namaLatin;audioFull=s.audioFull||{};
  const semua_suara=Object.values(audioFull)[0]||'';
  detail.innerHTML='<div class="ayat" style="text-align:center"><b>'+s.namaLatin+'</b><br><small>'+s.arti+'</small><br>'+(semua_suara?'<button class="btn" onclick="putar(\''+semua_suara+'\')">▶ Putar Semua</button>':'')+'<button class="btn" onclick="kembali()">← Daftar</button></div>'+
  s.ayat.map(a=>{const u=Object.values(a.audio||{})[0]||'';return '<div class="ayat"><small>'+a.nomorAyat+'</small><div class="a">'+a.teksArab+'</div><div class="l">'+a.teksLatin+'</div><div class="t">'+a.teksIndonesia+'</div>'+(u?'<button class="btn" onclick="putar(\''+u+'\')">🔊</button>':'')+'</div>';}).join('');
}
function putar(u){if(!u)return;aud.pause();aud.src=u;aud.play();}
function kembali(){aud.pause();detail.style.display='none';list.style.display='block';judul.textContent="Al-Qur'an";}
muat();
</script></body></html>
